 NAME_clone_guard_system:0 "Emperor's Wrath"
 NAME_clone_guard_home_retured:0 "Rebirth"
 NAME_clone_guard_system_retured:0 "New Dawn"

 io_chosen.1.name:0 "§MHerald of the Apocalypse§!"
 io_chosen.1.desc:0"While others study our past history, they will find it filled with enigmas — even considering our race's psionic abilities, our progress has been far more rapid than that of other civilizations. This is not to mention the seemingly abrupt technological advances and social transformations at critical junctures. Of course, we ourselves know the truth. As early as the medieval era, we entrusted our fate entirely to our parton, who in turn made a promise: we would gain the power to reach the stars, for within the inky blackness of the void lie countless other beings beyond ourselves. We shall seize the boon of their destinies and offer it all to our parton with both hands. Thus, we shall utterly destroy this decaying mortal world and, under the parton's radiance, usher in the rebirth of ourselves and the entire cosmos."
 io_chosen.1.a:0"And this is the beginning of the end."
 tr_psionic_complete:0 "§MPsionic§! Tradition has been completed, map of the entire galaxy has been revealed."
 origin_chosen_of_the_shroud:0 "§MHerald of the Apocalypse§!"
 origin_chosen_of_the_shroud_desc:0 "§RWARNING: Challenging Origin§!\nBefore entering space, this civilization had been selected by the patron from the shroud as the devastator of the galaxy."
 origin_chosen_of_the_shroud_effects:0 "—Complete the §MPsionic Tradition§!, get all §MPsionic Technologies§! and forge a Covenant with §MEnd of the Cycle§! at the start. \n—Any nation fully enveloped by the §MAura of the End§! will be corrupted into our §Hvassal§!.\n—Will be declared as a §GCrisis§! at the start and §Gignite a war with the entire galaxy§!。\n—Every time you win a fleet battle, you have a chance to get §Gboon§! from the shroud.\n-If there is no country with §HGalactic Sovereign§! origin, this origin will be replaced with §HProsperous Unification§!."
 origin_chosen_of_the_shroudnegative_effects:0 "—Will be declared as a §RCrisis§! at the start and §Rignite a war with the entire galaxy§!。\n—Every time you fail a fleet battle, you have a chance to get §Rcurse§! from the shroud.\n—All Galactic Imperium/Community members get §HPsionic Suppression§! technology at the start."
 ai_shourd_chosen:0 "Shourd Energy"
 NAME_Enslaved_Species_Souls: "Enslaved [slave_species.GetName] Souls"

 boon.io_chosen:0 "It looks like the powerful presence in the shroud is very happy with our recent victory and willing to give us a little support."
 
 io_chosen.3029.desc:0 "[won_leader.GetName]'s excellent performance in the battle in [won_locationr.GetName] was appreciated by our patron, and now our patron has blessed him."
 utopia.3030.desc:0 "$boon.io_chosen$$boon.psi.link$\n\nA profound sense of calm is spreading throughout the [Root.GetName], and it seems to affect even those without psychic abilities."
 utopia.3031.desc:0 "$boon.io_chosen$$boon.ship.link$\n\nThe normal wear-and-tear that all starships suffer from has all but disappeared in our fleets. As a result, our upkeep costs have been significantly decreased."
 utopia.3032.desc:0 "$boon.io_chosen$$boon.psi.link$\n\nA collective knowledge base that is shared telepathically between our scientists has been established, which will greatly increase the efficiency of their work."
 utopia.3033.desc:0 "$boon.io_chosen$$boon.ship.link$\n\nThe crews of our warships can now augment the strength of our shield systems by using their psionic powers."
 utopia.3034.desc:0 "$boon.io_chosen$$boon.ship.link$\n\nUsing their psionic powers, our crewmembers are now able to augment the strength of our weapon systems."
 utopia.3035.desc:0 "$boon.io_chosen$$boon.ship.link$\n\nUsing their psionic powers, our crewmembers are now able to increase the firing rate of our weapon systems."
 utopia.3036.desc:0 "$boon.io_chosen$$boon.psi.link$\n\nA new sense of solidarity has appeared in the hearts and minds of our citizens, and they seem more willing to work together towards the mutual goals established by our government."
 utopia.3037.desc:0 "$boon.io_chosen$$boon.psi.link$\n\nOur empaths are stronger than ever before, resulting in greater political influence."
 utopia.3038.desc:0 "$boon.io_chosen$$boon.psi.link$\n\nWe have never felt a greater sense of unity."
 utopia.3039.desc:0 "$boon.io_chosen$$boon.ship.link$\n\nUsing their psionic powers, our crewmembers are now able to directly affect the movement of our ships, increasing their evasiveness in the face of enemy fire."
 utopia.3040.desc:0 "$boon.io_chosen$$boon.ship.link$\n\nUsing their psionic powers, our crewmembers are now able to perform limited field repairs, mending hull fissures with their minds alone."
 utopia.3041.desc:0 "$boon.io_chosen$$boon.psi.link$\n\nOur telepaths have used this power to momentarily slow down the aging process for our most prominent leaders, adding decades to their natural lives. Alas, there was not enough psychic energy to bestow this effect upon the population at large."
 utopia.3041.tooltip:0 "All leaders gain the §YIncreased Lifespan§! trait, granting §G+40§! years of leader lifespan."
 utopia.3042.desc:0 "$boon.ship.link$\n\nUsing their psionic powers, our crewmembers are now able to augment the strength of the thrusters on their ships, resulting in greatly increased sub-light speed."
 utopia.3043.desc:0 "$boon.io_chosen$$boon.psi.link$\n\nThis has fortified the minds of our soldiers, who are now willing to brave any dangers on the battlefield. Their esprit de corps is without equal."
 utopia.3044.desc:0 "$boon.io_chosen$$boon.psi.link$\n\nWe can now sense vessels as they move through space at a far greater distance than any conventional sensor array would be capable of."

 boon.io_chosen_neg:0 "It looks like the powerful presence in the shroud is very unhappy with our recent defeat and cursed us."

 utopia.3050.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\nThis has had a profound effect on the happiness of our citizens, and a sense of gloom now pervades throughout the [Root.GetName]. Even the mundanes can feel it."
 utopia.3051.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\nThis negative energy has spread doubt within the minds of our citizens. Many are turning towards new radical ideas that are not in line with those of our government. The effect has even spread to non-psychic citizens!"
 utopia.3052.desc:0 "$boon.io_chosen_neg$$curse.ship.link$\n\nTheir armor has grown brittle, and can no longer sustain the punishment it once could."
 utopia.3053.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\nFor some reason, this has had a detrimental effect on birth-rates throughout the [Root.GetName]. This has even affected members of races without any inherent psionic ability!"
 utopia.3054.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\nThe minds of our researchers have been clouded, and they are having great difficulty focusing on their work."
 utopia.3055.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\nThe rate at which we accumulate political influence has been greatly diminished."
 utopia.3056.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\nThe sense of unity that once existed between our citizens has been shattered."
 utopia.3057.desc:0 "$boon.io_chosen_neg$$curse.ship.link$\n\nOur ships move as if some kind of invisible force is holding them back, like a rubber-band. This has resulted in much slower sub-light travel."
 utopia.3058.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\nThis negative energy has eroded the morale of our ground troops, who will be much less effective in battle for a time."
 utopia.3059.desc:0 "$boon.io_chosen_neg$A powerful psychic backlash has bounced back through our conduit with the Shroud, and it seems to be interfering with our interstellar sensors.\n\nThe sensor resolution from all sources has been greatly diminished, resulting in much shorter sensor ranges."

 job_overlord_telepath:0 "Overlord Telepath"
 job_overlord_telepath_plural:0 "Overlord Telepath"
 job_overlord_telepath_desc:0 "The psychic army, which serves the shroud worshipers of their overlord, supervises this vassal to ensure that it contributes everything to their god."
 job_overlord_telepath_effect_desc:1 "£job_overlord_telepath£ $job_overlord_telepath_plural$produces £unity£ §Y$unity$§!，decrease £crime£ §Y$PLANET_CRIME_TITLE$§!, according to the different covenants signed by the overlord, it provides negative effects for the planet and produces resources for the overlord."

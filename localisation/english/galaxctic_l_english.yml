 io_start_events.2.empire1:0 "Imperium Strength:§PWeak§!"
 io_start_events.2.empire1.tooltip:0 "The Imperium lost its former glory and was struggling in ruins."
 io_start_events.2.empire1.tooltip.2:0 "The rule of the Imperium was about to collapse, the old authority was lost, and the people of the galaxy cursed at the name of the emperor. Rebellions of all kinds followed, and one of the largest even left the capital of the Imperium in ruins. If the emperor wants to revive the Imperium, he must restore the reputation of the Imperium (due to the emperor's Vilified civic, only this strength can be selected)."
 io_start_events.2.empire2:0 "Imperium Strength:§GRising§!"
 io_start_events.2.empire2.tooltip:0 "The rising Galactic Imperium have just taken center on the interstellar stage, and only time will tell if they can withstand the crown."
 io_start_events.2.empire3:0 "Imperium Strength:§EStable§!"
 io_start_events.2.empire3.tooltip:0 "The rule of the Imperium is currently stable. Long live the emperor!"
 io_start_events.2.empire4:0 "Imperium Strength:§BHeyday§!"
 io_start_events.2.empire4.tooltip:0 "The Empire is at the peak of its history. No one knows whether this prosperity will last, or a turning point in history is coming."
 io_start_events.2.empire5:0 "Imperium Strength:§MLegend§!"
 io_start_events.2.empire5.tooltip:0 "No one can tell how long the Empire has been since its founding, and it is widely believed that it is as old as the Galaxy and will live with it forever, as its name suggests."
 io_start_events.2.empire6:0 "Imperium Strength:§UTranscendent§!"
 io_start_events.2.empire6.tooltip:0 "The Fallen Empires failed, and the Galactic Imperium will define success itself."
 io_start_events.2.awaken:0 "Imperium Strength:§3Awakened§!"
 io_start_events.2.awaken.tooltip:0 "Galaxy, we are whole. The inferior fragments have seen the truth and joined our collective once more. How lucky you are to witness this moment. The supreme lifeform once more strides the stars.\n\nWe will now be taking command of your '§YGalactic Community§!'. Celebrations are warranted."
 io_start_events.2.h1:0 "Initial boundary generation:§PNone§!"
 io_start_events.2.h2:0 "Initial boundary generation:§YAI Only§!"
 io_start_events.2.h3:0 "Initial boundary generation:§GAll§!"
 io_start_events.2.h3.tooltip:0 "Player can't choose AI only if they play as the emperor."

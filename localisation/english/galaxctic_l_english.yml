 ap_master_of_own_life:0 "Master of own Life"
 ap_master_of_own_life_desc:0 "Indeed, we have been unknowingly deprived of the ability to reproduce and transformed into mass-cloned war machines. However, it is not the modification that is wrong, it is that we do not have the right to choose how we are modified. The achievements of our society today prove that we are not only adapted to life in the post-biomodification era, but are superior to any so-called natural life. Then it's time, starting today, we will define our own lives for ourselves. Since the body is but fleeting, let it burn brilliantly!"
 overtuned_traits_allowed:0 "- Allows selection of §YOvertuned§! Traits for our Clone Soldier pops. These can be further boosted by the §YDamn the Consequences§! Edict.\n- §YOvertuned§! Traits can be freely added and removed through §Y$tech_gene_tailoring$§!."
 requires_clone_gene_unlocked:0 "$TRIGGER_FAIL$Need to have become fertile again or unlock the potential of clone soldiers."

 origin_galactic_hegemon:0 "§RGalactic Sovereign§!"
 origin_galactic_hegemon_desc:0 "After several generations of efforts,this empire finally unified the entire galaxy under their rule."
 origin_tooltip_galactic_hegemon_effects:0 "-Start game as §HGalactic Emperor§!.(AI with this origin will also become the emperor,so if you want to become the rebel,you can lock an AI with this origin)\n-At the start of the game, countries start with borders already formed. All countries join the Galactic Imperium, with the exception of those with Hegemon or Common Ground origins, and those that are not capable of cooperation, such as exterminator machines, hive-devourers, fanatic purifiers, and others..\n-Countries with Hegemon or Common Ground Origin keep their respective federations,do not join the Galactic Imperium and get a special national policy that provides huge bonuses.\n-Each country will receive a lot of resources and a huge bonus to the construction speed within 5 years of the game,allowing them to quickly improve their economic system.\n-The emperor will get a magnificent Ecumenopolis and several planets that provide basic resource output.If multiple countries have this origin, all these countries will receive these rewards, but only one will become the emperor."
 origin_galactic_custodian:0 "§BGalactic Custodian§!"
 origin_galactic_custodian_desc:0 "After several generations of efforts, this civilization was recognized as the custodian of the galaxy."
 origin_tooltip_galactic_custodian_effects:0 "-Start the game as the Custodian.(It is still valid for AI to have this origin)\n-At the start of the game, countries start with borders already formed. All countries join the Galactic Community, with the exception of those that are not capable of cooperation, such as exterminator machines, hive-devourers, fanatic purifiers, and others...\n-Each nation will receive massive resources and a huge bonus to construction speed, allowing them to quickly improve their economy.\n-Custodian has more territory and two additional planets."
 civic_galactic_beacon:0 "Galactic Beacon"
 civic_galactic_beacon_desc:0 "This country and the federation it leads is an egalitarian island in the dark galaxy under the rule of the Galactic Imperium,as well as a political sanctum for many anti-imperial people."
 civic_imperial_rival:0 "Imperial Rival"
 civic_imperial_rival_desc:0 "This country has had a long-term confrontation with the current leaders of the Galactic Imperium in order to fight for Galactic hegemony. They have been seeking to defeat the Imperium,especially in the military."
 build_start_modifier:0 "National Development Plan"
 gio_planet_life_heaven_modifier:0 "Heaven of Life"
 gio_planet_life_heaven_modifier_desc:0 "Unique bonuses for the country of origin of Life-Seeded."
 io_transcendent_modifier: "Transcendent Force"
 io_transcendent_modifier_desc: "Curse you, Paradonkey! Your stupid building limits can't hold me back anymore!"

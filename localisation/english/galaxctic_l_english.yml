 io_start_events.1000.name: "No Galactic Emperor Origin Country Detected"
 io_start_events.1000.desc: "You have not selected any Galactic Emperor origin country (either as a player or AI), which may prevent you from experiencing the MOD's unique content. However, the Hive Fallen Empire control node added in version 4.0 will attempt to become the Galactic Emperor after awakening. You can click the button below to force its immediate awakening and coronation for an alternative experience."
 io_start_events.1000.a: "Let them awake up."
 io_start_events.1000.b: "Let them sleep."

 civic_outside_the_border:0 "Outside The Border"
 civic_outside_the_border_desc:0 "If any empire used Emperor or Custodian Origin,this empire won't join the Community/Empire,auto removed after game strated if there is no Emperor or Custodian."
 building_imp_stronghold:0 "Planetary Fortresses Group"
 building_imp_stronghold_desc:0 "These majestic fortresses spread across the surface of the planet and are said to have protected the inhabitants of this Ecumenopolis since the foundation of the Galactic Imperium."
 origin_clone_guard:0 "§YClone Guard§!"
 origin_clone_guard_desc:0 "This specie, after its war potential was discovered by the Imperium, was uplifted and replicated on a large scale for warfare. After the Imperium finally conquered the galaxy, they also acquired a fief as their home."
 origin_clone_guard_effects:0 "-Start as a §HBulwark§! special subject of the empire.\n-begins with the §HClone Soldier§! trait (mechanism is the same as the §HClone Army§! origin), after researching the §HGene Seed Purification§! technology can be upgraded to §HClone Soldier Ascendant§! through a special project , but cannot restore fertility unless §Rretrieves its birthplace§!.A special Ascension Perk can be choose to unlock §YOvertuned§ traits. \n-The country will have some populations conquered in previous wars to alleviate the population shortage caused by the infertility of clones. \n-Different from §HClone Army§! Origin, can be freely genetically modified (please ignore the red letter on the trait)。\n-If there is no country with §HGalactic Sovereign§! origin, this origin will be replaced with §HProsperous Unification§!."
 START_SCREEN_CLONE_GUARD:0 "The planet named [GetHomeWorldName] is not our true origin. In fact, our history begins at the moment when we were created as warriors, before it was said that we were only beasts, but with war potential, and thus were elevated to the warriors of the creator. Since then, we have been massively cloned to fight for the creator. When the entire galaxy was finally united under the banner of the creators, they did not forget our contribution, but generously handed over an entire conquered country to us as a fief. \n\nToday, although we are still infertile due to flaws in the technology that made us. Yet by cloning, we can be more efficient and powerful than other species. Our next mission will be for our creators to guard the fruits of their victory, and as long as we move forward together, governing the entire galaxy is not difficult."
 origin_clone_guard_secondary_species:0 "Fief Species"
 building_clone_guard_clone_vat:0 "Military Cloning Complex"
 building_clone_guard_clone_vat_desc:0 "The building consists of a series of complex facilities to assemble clone troopers and provide necessary life support."
 building_clone_guard_clone_vat_effect_desc:0 "Produces and sustains §Y20§! £pops£ §Y$clone_soldier$§! Pops. The effectiveness of this growth is reduced as the $building_clone_guard_clone_vat$ reaches capacity.\nOur scientific advances in the field of genetics will provide more building caps."
 io_clones.4.name:0 "Ascendant Plan"
 io_clones.4.desc:0 "A genetic engineer in [Root.Capital.GetName] recently came up with a bold idea. He argues that our gene-seed purification technology should not be applied to just a few elite soldiers. Since we are a species that relies on cloning technology to reproduce, then we can completely use this technology to achieve our overall evolution. We should immediately start a new research project to improve the genetic template we use for cloning and further update us all through a unified remodeling operation. Just imagine how powerful our nation would be if every §Y[Root.GetSpeciesName]§ had a will of steel and physical strength that nearly broke the laws of physics!"
 io_clones.4.a:0 "Excellent."
 CLONE_GUARD_UNLOCK_POTENTIAL:0 "Ascendant Plan"
 CLONE_GUARD_UNLOCK_POTENTIAL_DESC:0 "The door of evolution is opening to us, and we must actively embrace evolution, integrate into evolution, and become evolution itself."
 io_clones.23.name:0 "Ascendant Plan: Complete"
 io_clones.23.desc:0 "Finished! The [Root.GetSpeciesNamePlural] has been renewed, and now we have a power that no other race can match, not even the elite of the Imperial Legion can compete with one of our common people. The Imperium should value the power of an invincible division like ours."
 io_clones.23.a:0 "[Root.GetSpeciesName] Strong!"
 io_clones.22.name:0 "Perfect Clones"
 io_clones.22.desc:0 "Finished! We have now not only regained our fertility, but we have also retained the power that comes from genetic seed purification technology. Now we have reached perfection."
 io_clones.10.name:0 "Home Planet"
 io_clones.10.desc:0 "An exploration team heading to [real_origin.GetName] in search of potential mineral resources has made an unexpected discovery. On the surface of [real_origin.GetName] there is intense radiation and citys in ruins, with skeletons resembling [Root.GetSpeciesName]. This all leads to the conclusion that [real_origin.GetName] is probably our home planet. In order to retrieve our past history and fertility, the Science Department has submitted an archaeological project at [real_origin.GetName]."
 io_clones.10.desc.2:0 "The suspicious planet [real_origin. GetName] found in the imperial archives has been controlled by us. Preliminary detection shows that there is intense radiation and citys in ruins on its surface. The first landing advance team also reported that there are bones in the city that are similar to [Root. GetSpeciesName]. In order to retrieve our past history and fertility, the Science Department has submitted an archaeological project at [real_origin.GetName]."
 io_clones.10.a:0 "This archaeological project is significant, approved."
 clone_guard_digsite:0 "Home Planet"
 clone_guard_digsite_desc:0 "Skeletons resembling us and city ruins found here indicate that this is the likely place of our origin. \n\nExploitation here will reveal our past and give us an opportunity to regain our fertility."
 io_clones.11.name:0 "The Primal Scene of [From.GetName] the [Root.Owner.GetSpeciesName] Saw"
 io_clones.11.desc:0 "Initial DNA sequencing has confirmed significant similarities between our genetic make-up and that of the [Root.Owner.GetSpeciesName]-like skeletons found in the ruins of the city, and it has been concluded that the remains belong to our ancient predecessors, from before we were clones. Analysis of the ruins of the buildings also determined that the buildings were built to fit our bodily structure. This basically verifies the hypothesis that this planet is our birthplace.\n\nAs a result, the theory that [original_emperor.GetName] once preached that we are uplifted beasts has been broken. However, no historical archives can be found in the city to interpret, and the DNA in the remains is also incomplete due to radiation. A full investigation of [From.GetName] is required to find clues that can restore our fertility."
 io_clones.11.desc.imp_destoryed:0 "Initial DNA sequencing has confirmed significant similarities between our genetic make-up and that of the [Root.Owner.GetSpeciesName]-like skeletons found in the ruins of the city, and it has been concluded that the remains belong to our ancient predecessors, from before we were clones. Analysis of the ruins of the buildings also determined that the buildings were built to fit our bodily structure. This basically verifies the hypothesis that this planet is our birthplace.\n\nAs a result, the theory that old Imperium once preached that we are uplifted beasts has been broken. However, no historical archives can be found in the city to interpret, and the DNA in the remains is also incomplete due to radiation. A full investigation of [From.GetName] is required to find clues that can restore our fertility."
 io_clones.12.name:0 "The Venerable Ancient Battlefield"
 io_clones.12.desc:0 "After a search of the surface of [From.GetName], our scientists discovered a sign of fighting, with skeletons from [Root.Owner.GetSpeciesName] and [original_emperor.GetSpeciesName]. Apparently this is evidence that [original_emperor.GetName] has invaded the planet. Near the body of an officer of [original_emperor.GetAdj] we find his personal diary, which states: The combat skills and will to resist of these natives are astonishing, and I am sure they will be a good source of soldiers when the Empire conquers here.  We've figured out why we were chosen to be soldiers of the Imperium, yet more questions about our history still linger. Why is this planet turned into a wasteland? Why does the Imperium have to choose cloning technology?\n\nAfter paying tribute to the heroic warriors of the old [Root.Owner.GetSpeciesName], our scientists are back to work."
 lones.12.desc.imp_destoryed:0 "After a search of the surface of [From.GetName], our scientists discovered a sign of fighting, with skeletons from [Root.Owner.GetSpeciesName] and old Imperium soldier. Apparently this is evidence that old Imperium has invaded the planet. Near the body of an officer of the old Imperium we find his personal diary, which states: The combat skills and will to resist of these natives are astonishing, and I am sure they will be a good source of soldiers when the Empire conquers here.  We've figured out why we were chosen to be soldiers of the Imperium, yet more questions about our history still linger. Why is this planet turned into a wasteland? Why does the Imperium have to choose cloning technology?\n\nAfter paying tribute to the heroic warriors of the old [Root.Owner.GetSpeciesName], our scientists are back to work."
 io_clones.13.name:0 "Dark Side of Fate"
 io_clones.13.desc:0 "After a thorough search of the surface of [From.GetName], we are convinced that due to the heroic efforts of our ancestors, [original_emperor.GetName] has never succeeded in establishing a settlement on the surface of this planet. So they abandoned their attempts at ground attack and instead used fleet fire to raze the surface of [From.GetName], destroying the civilization of our ancestors. No corpses have been found inside any of the ruined cities that were not severely DNA damaged by radiation, and [original_emperor.GetName] must have used previously captured captives to create our clone population. The hope of finding the complete genetic sequence of our ancestors in [From.GetName] to restore fertility looks pretty slim. \n\nHowever, in the rubble of a central city in [From.GetName] we have found some encrypted data, the deciphering of these data may lead us to further clues."
 io_clones.13.desc.imp_destoryed:0 "After a thorough search of the surface of [From.GetName], we are convinced that due to the heroic efforts of our ancestors, The old Imperium has never succeeded in establishing a settlement on the surface of this planet. So they abandoned their attempts at ground attack and instead used fleet fire to raze the surface of [From.GetName], destroying the civilization of our ancestors. No corpses have been found inside any of the ruined cities that were not severely DNA damaged by radiation, and The old Imperium must have used previously captured captives to create our clone population. The hope of finding the complete genetic sequence of our ancestors in [From.GetName] to restore fertility looks pretty slim. \n\nHowever, in the rubble of a central city in [From.GetName] we have found some encrypted data, the deciphering of these data may lead us to further clues."
 io_clones.14.name:0 "Swallowstone Civilization Historia"
 io_clones.14.desc:0 "Through the analysis of those encrypted data, we have located an artificial cave thousands of meters underground, where everything recorded in the past of our civilization, all knowledge and culture, were engraved on the rock wall for preservation as long as possible. It is the maximum effort that our ancestors made to preserve our civilization. Although it looks very primitive and simple, our scientists all burst into tears when they saw it. In the deepest part of the cave we found a sarcophagus containing a corpse of [Root.Owner.GetSpeciesName] with all the genetic sequences we need to restore fertility. We are now convinced that we are from [From.GetName]. \n\nThe opportunity to break free from the shackles of cloning technology is at hand, but it also means giving up the power that comes from it. Although we have always hated the shackles of infertility, the gain from the power of cloning technology far outweighed the loss of infertility. Are we going to choose to get our fertility back?"
 io_clones.14.desc.a:0 "It's time to get back to the normal way of life."
 io_clones.14.a.tooltip:0 "The fertility of our species will be restored, at the cost of greatly diminishing clone trooper traits. Military clone complexes will provide the same low population assembly speed as normal clone vats."
 simple_fertility_restoration:0 "Simple Fertility Restoration"
 io_clones.14.desc.b:0 "Why should we give up our hard-earned power?"
 io_clones.14.b.tooltip:0 "We will keep the status quo even though the people will be unhappy about it."
 io_clones.14.desc.c:0 "I want both of them."
 io_clones.14.c.tooltip:0 "Initiate a program that requires a significant investment in society research to maximize the advantages of clone troopers while restoring fertility."
 CLONE_SOLDIER_GUARD_FERTILITY_PERFECT:0 "Perfect Fertility"
 CLONE_SOLDIER_GUARD_FERTILITY_PERFECT_DESC:0 "Every effort must be made to stabilize our enhanced genes to ensure that the traits they carry are passed on to the next generation."
 trait_clone_soldier_fertile_perfect:0 "Perfect Clone Soldier"
 trait_clone_soldier_fertile_perfect_desc:0 "§LClones at their genetically-engineered peak, with further improved strength, efficiency, durability, and longevity - and all of these traits can be passed on to the next generation through reproduction.§!"
 leader_trait_clone_army_perfect_commander:0 "Perfect Clone Army commander"
 leader_trait_clone_army_perfect_commander_desc:0 "Subjected since its creation to a military education regimen so intense few could endure it, this leader wields excellent martial and leadership abilities."
 io_clones.15.name:0 "Rebuild Home"
 io_clones.15.desc:0 "Now that we have determined that [real_origin.GetName] is our home planet, the restoration of her environment is also on the agenda. All members of society are actively organizing donations to provide funds for the terraform project. Our environmental engineering scientists Also working with unprecedented enthusiasm. We all look forward to returning to where we came from."
 io_clones.15.a:0 "The wanderer will return to his hometown after all."
 io_clones.16.name:0 "Hometown, New Home?"
 io_clones.16.desc:0 "The terraform project of [Root.GetName] has been completed, and the ruins of the old days have been carefully preserved as a permanent memorial during the terraform. The caves that preserve our civilization's past have become the most famous tourist attractions in the whole of [From.GetName]. Our people gaze with kindness and curiosity at the traces left by their ancestors. Immigrants are pouring into [Root.GetName], and there is a suggestion that [Root.GetName] should be our new capital."
 io_clones.16.desc.spiritualist:0 "The terraform project of [Root.GetName] has been completed, and the ruins of the old days have been carefully preserved as a permanent memorial during the terraform. And the caves that preserve our civilization's past have become holy places throughout [From.GetName]. Our people gaze with kindness and curiosity at the traces left by their ancestors. Immigrants are pouring into [Root.GetName], and there is a suggestion that [Root.GetName] should be our new capital."
 io_clones.16.a:0 "It is time to go home."
 io_clones.16.a.tooltip:0 "All unemployed people in the Empire and about half of the population of the old capital will move to the new capital."
 io_clones.16.b:0 "Capital status of [From.GetCapitalName] should not be relinquished."
 terraforming_enthusiasm:0 "Enthusiasm for terraforming"
 build_new_capital:0 "Building a New Capital"
 build_new_capital_desc:0 "Local construction workers are enthusiastic."
 immigration_wave:0 "Immigration Wave"
 immigration_wave_desc:0 "Immigrants are pouring into the planet."
 d_origin_cave:0 "Stone Carvings"
 d_origin_cave_desc:0 "The stone walls of the entire artificial cave system are inscribed with ancient writings, recording everything of a civilization."
 militarized_society:0 "Militarized Society"
 militarized_society_desc:0 "Before taking this fief and building a nation, we were first and foremost an army. Consistent discipline and dedication are the cornerstones of our society, although not everyone in the land can embrace such a tradition.\n\n§YThe greater the percentage of the population that has the §HClone Soldier§! trait, the stronger the effect of this modifier.§!"
 job_militia:0 "Militia"
 job_militia_plural:0 "Militia"
 job_militia_desc:0 "These clone soldiers performed simple production jobs and received military training in their spare time."
 job_elite_soldier:0 "Clone elite"
 job_elite_soldier_plural:0 "Clone elite"
 job_elite_soldier_desc:0 "Through intentional inducement in the cloning vat, these warriors become stronger and smarter, often as officers, engineers or special forces in the military."
 mod_job_elite_soldier_add:0 "$job_elite_soldier$ Job"
 io_clones.100.name:0 "Our birthplace?"
 io_clones.100.desc:0 "One of the important purposes of our spy network in the Imperium is to find our true origin, but the relevant information about our species's past seems to have been deleted by the Imperium, so there is no progress in this task... until today. \nOur spies accidentally found the observation record of [our_real_home.GetName] in the imperial scientific database, which mentioned the cloning experiment of biological samples captured locally. However, [our_real_home.GetName] is now shrouded in a highly toxic atmosphere, and there is no possibility of life. The attempt to find out why [our_real_home.GetName] has become such a problem has encountered unprecedented resistance. The agents of the Imperium may have realized that we have found this clue, so we have to stop the operation. The only way to finally solve this puzzle is to include [our_real_home.GetName] into our territory. Of course, this means rebellion against the Imperium."
 io_clones.100.2.desc:0 "One of the important purposes of our spy network in the Imperium is to find our true origin, but the relevant information about our species's past seems to have been deleted by the Imperium, so there is no progress in this task... until today. \nOur spies accidentally found the observation record of [our_real_home.GetName] in the imperial scientific database, which mentioned the cloning experiment of biological samples captured locally. However, [our_real_home.GetName] is now shrouded in a highly toxic atmosphere, and there is no possibility of life. The attempt to find out why [our_real_home.GetName] has become such a problem has encountered unprecedented resistance. The agents of the ISD may have realized that we have found this clue, so we have to stop the operation. The only way to finally solve this puzzle is to include [our_real_home.GetName] into our territory. Of course, this means rebellion against the Imperium."
 our_real_home_title:0 "Suspected birthplace"
 our_real_home_desc:0 "The information inadvertently found from the Imperial Observatory database indicates the location of our possible birthplace."
 our_real_home_location:0 "Coordinate of suspected birthplace"
 our_real_home_location_desc:0 "The inadvertent discovery of information from the Imperial Observatory database suggests that this planet may be our birthplace."

 origin_monopoly_chaebol:0 "§YMonopoly Chaebol§!"
 origin_monopoly_chaebol_desc:0 "This megacorp seized the moment, invested in its greatest project, the unification of the galaxy, and received its own reward. Now, the market across the galaxy is opening up to them."
 origin_monopoly_chaebol_effects:0 "-Start with §HImperial Charter§!.\n-Expand your business division and control more trade value to gain powerful §HTrade Monopoly§! modifier.\n-As long as you have the §HImperial Charter§!, you can ignore the restriction of not being able to vassalize members of the imperium, and establish §HSubsidiary§! through war within the imperium. All planets owned by the subsidiary are considered to own your branch when calculating the §HTrade Monopoly§!.\n-If there is no country with §HGalactic Sovereign§! origin, this origin will be replaced with §HProsperous Unification§!."
 trade_monopoly:0 "Trade Monopoly"
 trade_monopoly_desc:0 "The real ruler is not on the throne but at the desk, and controlling the economy of the galaxy is equal to controlling the galaxy.\n\n§YThe strength of this modifier depends on the proportion of the trade value produced by the systems with our branch in the imperium.§!"
 war_goal_wg_megacorp_subjugate_monopoly_chaebol:0 "Make Subsidiary"
 war_goal_wg_megacorp_subjugate_monopoly_chaebol_desc:0 "In the name of the Emperor, we will bring them the free trade of the Galactic Imperium.\n\nIn the event of a Status Quo peace, systems we occupy will be released as a new Subsidiary if they include at least one planet."
 casus_belli_cb_io_monopoly_chaebol:0 "Monopoly Chaebol"
 cannot_without_charter:0 "We need the Emperor's trade charter to guarantee the legitimacy of this war."
 START_SCREEN_MONOPOLY_CHAEBOL:0 "Before our rise with the Galactic Imperium, we were just a small corp earning a meager income from sporadic trade around [GetHomeWorldName]. However, a godsent opportunity came to us. An empire of potential, thinking it has the power to rule the galaxy, chose to cooperate with us in exchange for everything needed for a great crusade. Wealth, resources, even ships, we gave them everything they asked for. Our merchant ships follow in the footsteps of their warships, reaping the profits of their conquests and feeding their war machines in return.Finally, after their imperium was built, we also got everything we needed to build our business imperium. \n\nSome people may think that we are nothing more than lackeys, the emperor's cash machine, that all our glory is only supported by a thin piece of paper. They were wrong. Some people compare the emperor to the brain of the imperium, then we are the heart, and the economic bloodline of the entire imperium depends on us to flow. Who can judge which is more important?"
 origin_outside_the_border:0 "§EOutside the Border§!"
 origin_outside_the_border_desc:0 "This civilization sees supranational organizations as a violation of its own independence and sovereignty, and resolutely resists cooperation with such organizations."
 origin_outside_the_border_effects:0 "- If a country uses §HGalactic Sovereign§! or §HGalactic Custodian§! origin, the country will not join the Community/Empire at first. \n-Automatically get the civic of the same name and its bonuses. \n-If there is no §HGalactic Sovereign§! or §HGalactic Custodian§! country of origin, this origin will be replaced with §HProsperous Unification§!."
 origin_internal_border:0 "§EInternal Border§!"
 origin_internal_border_desc:0 "This civilization was torn into two regimes that did not recognize each other in the conflict between supranational power expansion and national self-determination. Half of its territory is occupied by loyal members of the imperium/community, while the other half remains independent."
 origin_internal_border_effects:0 "- Will generate a neighbor of the same species, have the same government and ideology as the emperor/custodian and join the galactic imerpium/community. \n-The two countries gain claims on each other's territory. \n-If there is no §HGalactic Sovereign§! or §HGalactic Custodian§! country of origin, this origin will be replaced with §HProsperous Unification§!.\n\nWARNING: This origin country and emperor must both be of the regular/hive/mechanical type or it will cause crash!"
 origin_galactic_nemesis:0 "§MGalactic Nemesis§!"
 origin_galactic_nemesis_desc:0 "§RWARNING: Challenging Origin§!\nThis civilization are would-be harbingers of galactic doom, backed by unknowable powers."
 origin_galactic_nemesis_effects:0 "-Unlock §MGalactic Nemesis§! Ascension perk at the start. \n-The highest §MMenace Level§! will be unlocked immediately, and §Rignite a war with the entire galaxy§!.\n-If there is no §HGalactic Sovereign§! or §HGalactic Custodian§! country of origin, this origin will be replaced with §HProsperous Unification§!."
 io_imperial_border.4.name:0 "§MGalactic Nemesis§!"
 io_imperial_border.4.desc:0 "All the doubts that plagued us in the past have been answered, and all the pains that surrounded us in the past will been relieved. The starlight will be extinguished in the whole galaxy, and we will be the only light. There is only one obstacle in our way today - [global_event_country.GetGalCommunityOrGalImperium]. The corrupt politicians of this illegal organization are sounding off from the pulpit, trying to mobilize their rabble to destroy our great work. The galaxy is calling for a total war, a war more total and complete than all intelligent life can imagine, and we must win."
 io_imperial_border.4.a:0 "Come on."
 tr_supremacy_complete:0 "§MBecome Crisis§! Ascension perk has been unlocked, map of the entire galaxy has been revealed."
 explore_modifier:0 "Deep Space Exploration"
 explore_modifier_desc:0 "Most of the Galaxy has been carved up, and we should explore the remaining parts more carefully."

 origin_old_alliance:0 "§YOld Alliance§!"
 opinion_old_alliance:0 "Old Alliance"
 origin_old_alliance_desc:0 "As an important ally in international cooperation with the Emperor long before the unification of the galaxy, the country was granted a permanent seat in the Imperial Council after the establishment of the Galactic Imperium."
 origin_old_alliance_effects:0 "-Start with a larger territory and permanent seat of the Imperial Council at the start. Gain relationship bonuses with the Emperor.\n-If there is no country with §HGalactic Sovereign§! origin, this origin will be replaced with §HProsperous Unification§!."
 origin_secondary_hemegon_vassal:0 "§YHegemon Vassal§!"
 origin_secondary_hemegon_vassal_desc:0 "This civilization was conquered and vassalized by another galactic hegemon shortly after entering space."
 origin_tooltip_secondary_vassal_hegemon_effects:0 "-At the beginning, become the vassal of a larger empire."
 origin_secondary_hegemon:0 "§YSecondary Hegemon§!"
 origin_secondary_hegemon_desc:0 "This civilization forged its hegemony against the Galactic Empire. Although its sphere of influence is small, it has a strong control over the areas under its jurisdiction."
 origin_tooltip_secondary_hegemon_effects:0 "-At the beginning, has a larger territory, more fleets and three §HVassals§!\n-If there is no country with §HGalactic Sovereign§! origin, this origin will be replaced with §HProsperous Unification§!."
 war_goal_wg_conquer_imperial_member:0 "Vassalize Imperium member"
 war_goal_wg_conquer_imperial_member_desc:0 "This war is to force members of the Imperium to leave the Imperium and become our vassals.\n\nIn the event of a Status Quo peace, systems we occupy will be released as a new Vassal if they include at least one planet."
 casus_belli_cb_io_invade:0 "Conquer Imperium"
 origin_prospecting_machine:0 "§YProspecting Machinery§!"
 origin_prospecting_machine_desc:0 "This machine-intelligent network was deployed by the Imperium to the wastelands left by the wars of galactic unification to mine resources and conduct industrial production in areas so devastated that they were almost uninhabitable for organic life."
 origin_prospecting_machine_effects:0 "-Start the game as a §HProspectorium§! subject of the Imeperium.\n-§H$district_mining$§! are uncapped, add §G+2§! £housing£ §YHousing§! and every §Y3§! §H$district_mining$§! grant §G1§! £building£ §YBuilding Slot§! each.\n-Barren planets can be transformed into a §HMachine World§! without the need for Machine World Ascension Perk.\n-If there is no country with §HGalactic Sovereign§! origin, this origin will be replaced with §HProsperous Unification§!."
 SUBJECT_academy_territory:0 "Academy Territory"
 SUBJECT_DESC_academy_territory:0 "The free scientific research area designated by the emperor is not directly interfered by the imperial government, and is only responsible for providing scientific research results to the central government."
 SUBJECT_industrial_network:0 "Industrial Network"
 SUBJECT_DESC_industrial_network:0 "A network of artificial intelligence deployed by the Empire responsible for resource development and refinement, requiring the handover of some of the mined resources and no diplomatic powers."

 origin_esoteric_scholarium:0 "§YEsoteric Scholarium§!"
 origin_esoteric_scholarium_desc:0 "Split from the Curator Organization, this civilization has provided the Imperium with science and technology in exchange for a sector that allows for unrestricted freedom to conduct scientific research and the Imperium's military protection."
 origin_esoteric_scholarium_effects:0 "-Starting as a special vassal of the Empire's §HScholarium§! vassal. \n-The main species have the §HCurator Defector§! trait, which provides powerful bonuses and the Curator trait for scientists, and the habitable environment has been changed to §HOrbital Habitat§!. \n-The §HSpecialized Research§! buildings can be constructed, and the §HEvent Technology§! research option can be unlocked through §MRare Artifacts§!."
 trait_curator_defector:0 "Curator Defector"
 trait_curator_defector_desc:0 "Split from the Curator Organization, this species holds many technological secrets unknown to other species. But they often indulge in research and neglect other matters."
 building_curator_archive:0 "Curator Archive"
 building_curator_archive_desc:0 "The curator's wisdom is endless, and all we can take away is a drop in the ocean."
 esoteric_scholarium_system_NAME:0 "Esoteric Scholarium"
 esoteric_scholarium_system_DESC:0 "The starting solar system for Curator Origin, with a scientific habitat and a habitable planet."
 esoteric_scholarium_system_sol_NAME:0 "Esoteric Scholarium (Sol)"
 esoteric_scholarium_system_sol_DESC:0 "Solar system version of Curator Origin starting system."

 war_goal_wg_end_threat_chosen_of_shroud_desc:0 "This war is waged to expel the agents of the forces of the shroud in the material world."
 opinion_chosen_of_the_shroud:0 "Agent of the shroud"

 personality_chosen_of_the_shroud:0 "Chosen of the shroud"
 personality_chosen_of_the_shroud_desc:0 "The virtual oracle made a covenant with a powerful psionic existence, and as its agent expanded its influence in the material world through war."

 io_chosen.2681.name:0 "New Chosen"
 io_chosen.2681.desc:0 "Our Patron, §Y[GetShroudPatron]§! , was very pleased with §Y[FromFrom.GetName]§! 's victory and gave us a small portion of energy in the Shroud. The Psychic Secret Society was convinced that our close relationship with Patron would allow us to safely absorb this energy and use it. We selected a number of candidates, but only one of them could be given the opportunity to use this power, and who would that be?"

 community_overlord_failtext:0 "§RWe cannot join the Imperium while the Overlord is outside the Imperium.§!"
 io_chosen.2681.name:0 "新的获选者"
 io_chosen.2681.desc:0 "我们的超主，§Y[GetShroudPatron]§!，对§Y[FromFrom.GetName]§!的胜利非常满意，并在虚境中分出了一小份能量赐予我们。灵能使密团确信，我们与超主之间的亲密关系能让我们安全吸收这些能量并加以运用。我们挑选了一些候选人，但其中只能有一个人可以得到运用这份力量的机会，这个人会是谁呢？"

 community_overlord_failtext:0 "§R宗主在帝国外时，我们不能加入帝国。§!"

 origin_after_the_end:0 "§U离去之后§!"
 origin_after_the_end_desc:0 "告别了乘坐视界探针踏上多元宇宙之旅的同胞，留在母星的少数遗民选择在这个宇宙延续这个文明。银河的其他部分因为探针陷入了时间停止，这给了他们漫长的时间重建帝国的核心地带——长到与世隔绝的他们最终厌倦了一切，开始在自动化技术带来的无尽享受下沉沦。然而在时间停止结束后，他们发现银河已经一片残破，这毫无疑问被其他文明归咎于他们。不过，有着离去的同胞留下的无敌的科技遗产，谁会在乎一帮弱者的意见呢？只要将这些遗产重新启动……等等，还有人记得怎么启动吗？"
 origin_after_the_end_effects:0 "—开始游戏时成为一个特殊的§U视界守望者§!堕落帝国，拥有强力的舰船和建筑，但在完成§Y觉醒§!前无法建造新的。\n—在初始获得§Y觉醒§!局势，局势过程相当漫长，但随着局势进行，你将逐渐恢复使用§Y堕落帝国科技§!的能力。\n—银河系在一开始便是§U宇宙起源§!天灾之后的景象，许多星系和行星将会遭到破坏。\n—其他国家，尤其是其他§Y堕落帝国§!将会由于这些后果敌视你，你很可能成为一场§P危机战争§!甚至§R天堂之战§!的目标，然而，由于它们对你的科技的兴趣，你也有可能获得外交机遇。\n—作为其他国家，与使用该起源的国家共同进行游戏时，也会拥有独特的事件链从危机中恢复，并选择如何与新的堕落帝国相处。（强烈建议体验其他国家，尤其是皇帝/监管人的视角！）"
 io_start_events.2.ae1:0 "帝国国防部：§P未建立§!"
 io_start_events.2.ae2:0 "帝国国防部：§G建立§!"
 io_start_events.2.empire1:0 "帝国强度：§P衰弱§!"
 io_start_events.2.empire1.tooltip:0 "无论帝国有着怎样的荣光，都已经是过去式了，昔日的统治者在瓦砾堆中苟延残喘。不知在新兴的国家面前，他们还能否掌握自己和银河系的未来？\n\n皇帝以T2（或设置的更高水平）科技、有限的版图以及一个遗落星球首都开始游戏。"
 io_start_events.2.empire1.tooltip.2:0 "§R帝国的统治行将崩溃，旧日权威丧失殆尽，银河百姓谈到皇帝之名无不咒骂。各类反叛活动此起彼伏，其中一次最大的叛乱甚至使得帝国的首都沦为废墟。如果皇帝想要重振帝国，就必须恢复帝国的名望（由于皇帝拥有“千夫所指”，只能选择这个强度）。§!\n\n皇帝以T2（或设置的更高水平）科技、有限的版图以及一个遗落星球首都开始游戏。"
 io_start_events.2.empire2:0 "帝国强度：§G新兴§!"
 io_start_events.2.empire2.tooltip:0 "奋历世之余烈，终有今日。星海的一统使得皇帝站上了银河舞台的中央，刚刚完成的理想城工程更是证明了帝国的强大经济实力。然而，这一新兴强权能否承受皇冠之重，只有时间能告诉我们答案。\n\n皇帝以100权威，T3（或设置的更高水平）科技、稍大的版图、星际集会巨构以及一个几乎未建设的理想城首都开始游戏。"
 io_start_events.2.empire3:0 "帝国强度：§E安泰§!"
 io_start_events.2.empire3.tooltip:0 "帝国如今虽然谈不上空前盛世，但也算是安泰祥和，一切都在按照银河统一者的构想平稳前进。不过，谁又能说这平稳之下没有暗流涌动呢？\n\n皇帝以150权威，T4（或设置的更高水平）科技、广大的版图、完成一半建设的理想城首都、多个低级巨构、以及高度建设的锁定宜居星球（如果有）开始游戏。"
 io_start_events.2.empire4:0 "帝国强度：§B鼎盛§!"
 io_start_events.2.empire4.tooltip:0 "好几代皇帝的励精图治将星海帝国推上了历史的顶峰，繁华的理想城支撑帝国的经济，宏伟的舰队散播帝国的威名。这伟大盛世会永远持续吗？还是帝国由盛转衰的节点已然到来？\n\n皇帝以200权威，T5（或设置的更高水平）科技、宏大的版图、多个高级巨构以及多个理想城（或一个，如果没有设定锁定宜居星球）开始游戏。帝国海军将会全部由战列舰组成。"
 io_start_events.2.empire5:0 "帝国强度：§M神话§!"
 io_start_events.2.empire5.tooltip:0 "没人能说清楚帝国自建立至今已经过了多久，人们普遍认为她的历史和这片星海的历史一样长久，并将与星海一并永存，一如其名。\n§R然而，历史终将证明从来没有永恒之物，也许，埋葬这个帝国的就是§!§H你§!§R。实现它吧，你会得到作者的最高嘉许！§!§Y（当然用破坏平衡的mod就没意思了，不过也不禁止，开心就好）。§!\n§G当然，你也可以用这个强大到离谱的开局爽一把！§!\n\n皇帝以全部科技、宏伟的版图、多个高级巨构、多个拥有堕落帝国建筑的理想城（或一个，如果没有设定锁定宜居星球）开始游戏，皇帝的全部殖民地也将会拥有堕落帝国的资源建筑。帝国海军将会全部由战列舰组成。此外皇帝将会根据自身思潮获得四支包含泰坦的强力堕落帝国舰队。"
 io_start_events.2.empire6:0 "帝国强度：§U超然§!"
 io_start_events.2.empire6.tooltip:0 "§U堕落帝国失败了，星海帝国将亲自定义成功。§!\n§R给那些觉得神话强度还不够的人！§!\n\n皇帝以全部科技§U（包括本应由宇宙创生飞升解锁的科技，这意味着皇帝可以自由建造一切本专属于堕落帝国的建筑和战舰）§!、宏伟的版图、多个高级巨构、多个拥有堕落帝国建筑的理想城或一个，如果没有设定锁定宜居星球）开始游戏，皇帝的全部殖民地也将会拥有堕落帝国的资源建筑。帝国海军将会全部由战列舰组成。此外皇帝将会根据自身思潮获得四支包含泰坦的强力堕落帝国舰队。"
 io_start_events.2.awaken:0 "帝国强度：§3觉醒§!"
 io_start_events.2.awaken.tooltip:0 "星海啊，§3我们§!终成一体。那些低等的碎片终于看清真相，重归我们的集群。能亲眼见证这一刻，是你们的福分。§3众生之巅，再踏群星。§!\n\n现在，你们的“§Y星海共同体§!”将由我们接管。§R欢庆吧。§!\n\n§3蜂巢堕落帝国§!将会觉醒并成为§R星海帝皇§!，其强度与原版§3蜂巢觉醒帝国§!相同。"
 io_start_events.2.h1:0 "初始版图生成：§P无§!"
 io_start_events.2.h2:0 "初始版图生成：§Y仅AI§!"
 io_start_events.2.h3:0 "初始版图生成：§G全部§!"
 io_start_events.2.h3.tooltip:0 "玩家扮演帝国时，不能选择“仅AI”"

 io_start_events.2.i.tooltip:0 "为皇帝提供一产的特殊星球，如果你使用了帝国税mod，建议关闭。"
 io_start_events.2.i2:0 "奖励星球：§G有§!"
 io_start_events.2.i3:0 "奖励星球：§3堕落帝国§!"
 io_start_events.2.j1:0 "初始舰队生成：§P否§!"
 io_start_events.2.j2:0 "初始舰队生成：§G是§!"
 io_start_events.2.expand:0 "初始边界扩张上限：§Y[Root.io_setting_expand_max]§!"

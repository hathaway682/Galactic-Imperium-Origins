 io_start_events.1000.name: "未检测到星海帝皇起源国家"
 io_start_events.1000.desc: "你并没有选择任何星海帝皇起源国家（包括作为玩家或AI的），这一般会导致你无法体验MOD特色内容。不过，4.0加入的蜂巢堕落帝国掌控节点在觉醒后也会尝试成为星海帝皇。你可以点击下面的按钮让他立刻觉醒并登基，以带来别样的体验。"
 io_start_events.1000.a: "老登，起床了！"
 io_start_events.1000.b: "好好睡，好好睡。"

 civic_outside_the_border:0 "化外之民"
 civic_outside_the_border_desc:0 "如果有国家使用了监管人或者帝皇起源，这一帝国开始不会加入星海共同体/帝国。如果没有皇帝或监管人，游戏开始后会自动移除。"
 origin_clone_guard:0 "§Y克隆铁卫§!"
 origin_clone_guard_desc:0 "这一种族在被星海帝国创始者发现其战争潜力后接受了提升改造以及大规模复制以供战争之用。在帝国最终征服银河后，他们也获得了一片封地作为自己的家园。"
 origin_clone_guard_effects:0 "—作为帝国的§H戍邦§!特殊附庸开局。\n—开始拥有§H克隆人士兵§!特质（机制与§H克隆大军§!起源相同）。这些克隆人士兵还可以从事一些此起源专属的岗位，并按照其占总人口的比例提供加成。\n—开局比初始科技等级更高一级的战舰图纸以及一支额外舰队。\n—不同于§H克隆大军§!起源，可以自由进行基因改造（请无视特质上的红字）。\n—在完成§Y基因种子纯化§!科技后，可以通过特殊项目获得§H克隆人士兵先裔§!特质，并解锁一个新的专精飞升，允许你选择默认物种特质的§Y强夺天工§!版本。同时这些特质还可以被§Y不问后果§!法令进一步增强。\n—除非§R找回自己种族的发源地§!，否则没有§R恢复生育能力§!的可能。\n—如果没有§H星海霸业§!起源的国家，这个起源会被替换为§H繁荣一统§!。"
 START_SCREEN_CLONE_GUARD:0 "名为[GetHomeWorldName]的星球并非我们真正的起源。事实上，我们的历史始于我们作为士兵创造出来的那一刻，在此之前据说我们只是野兽，但却颇具战争潜力，因而被提升为创造者的战士。自此之后，我们就被大规模克隆以为创造者冲锋陷阵。当整个银河最终被统一在创造者的旗帜之下之后，他们并没有忘记我们的贡献，而是慷慨的将一整个被征服的国家交给我们作为封地。\n\n如今，尽管我们仍然因为制造我们的技术的缺陷无法生育。然而依靠克隆，我们可以比其他种族更加高效、强大。我们接下来的使命将是为我们的创造者守卫他们的胜利果实，只要携起手来前进，治理整个银河也并非难事。"
 origin_clone_guard_secondary_species:0 "封邑种族"
 building_clone_guard_clone_vat:0 "军用克隆复合体"
 building_clone_guard_clone_vat_desc:0 "该建筑由一系列复杂设施组成，用以组装克隆人士兵并提供必要的生命支持。"
 building_clone_guard_clone_vat_effect_desc:0 "产生并维系§Y20§!个£pops£§Y$clone_soldier$§!人口。当$building_clone_guard_clone_vat$达到其承载能力时增长的效率将会下降。\n我们在基因领域的科学进步会提供更多的建筑上限。"
 io_clones.4.name:0 "升变计划"
 io_clones.4.desc:0 "[Root.Capital.GetName]的一位基因工程师最近提出了一个大胆的设想。他主张，我们的基因种子纯化技术不应该仅仅应用在少数精英士兵身上。既然我们是依靠克隆科技繁衍的种族，那么我们完全可以借助这项技术实现我们全体的进化。我们应该立刻开展一项新的研究项目来改进我们用于克隆的基因模板，并进一步通过统一的改造手术完成对我们全体的更新。试想一下，如果每个§Y[Root.GetSpeciesName]§!都拥有近乎破坏物理法则的身体力量和钢铁般坚强的意志，那么我们的国家将会何等的强大！"
 io_clones.4.a:0 "好极了！立刻批准该项目并命令军方和科学部门给予全力支持！"
 CLONE_GUARD_UNLOCK_POTENTIAL:0 "升变计划"
 CLONE_GUARD_UNLOCK_POTENTIAL_DESC:0 "进化的门扉正向我们敞开，我们必须主动拥抱进化，融入进化，成为进化本身。"
 io_clones.23.name:0 "升变计划：完成"
 io_clones.23.desc:0 "完成了！[Root.GetSpeciesNamePlural]已经焕然一新，现在我们拥有其他种族难以企及的力量，甚至帝国军团的精锐都难以与我们的一位普通百姓相抗衡。帝国应当看重我们这样一支无敌之师的力量。"
 io_clones.23.a:0 "[Root.GetSpeciesName] Strong！"
 io_clones.22.name:0 "完美克隆人"
 io_clones.22.desc:0 "完成了！[Root.GetSpeciesNamePlural]现在不仅恢复了生育能力，还保留了基因种子纯化技术带来的强大力量，现在我们已经臻于完美。"
 io_clones.10.name:0 "故乡之星"
 io_clones.10.desc:0 "一支前往[real_origin.GetName]寻找潜在矿物资源的勘探小组有了意外的发现。在[real_origin.GetName]表面存在着强烈的辐射以及化为废墟的城市，而城市中还有酷似[Root.GetSpeciesName]的骸骨。这一切都导向一个结论：[real_origin.GetName]很可能是我们的母星。为了找回我们过去的历史以及生育的能力，科学部门已经提交了在[real_origin.GetName]的考古项目。"
 io_clones.10.desc.2:0 "之前在帝国档案中找到的可疑星球[real_origin.GetName]已经被我们掌握，初步探测显示其表面存在着强烈的辐射以及化为废墟的城市，第一批登陆的先遣队还报告了城市中还有酷似[Root.GetSpeciesName]的骸骨。这一切都导向一个结论：[real_origin.GetName]很可能是我们的母星。为了找回我们过去的历史以及生育的能力，科学部门已经提交了在[real_origin.GetName]的考古项目。"
 io_clones.10.a:0 "这个考古项目意义重大，立刻批准并设立专项拨款。"
 clone_guard_digsite:0 "故乡之星"
 clone_guard_digsite_desc:0 "在这里发现的酷似我们的骨骸以及城市废墟表示这里很有可能是我们的起源地。\n\n对这里的发掘将会揭示我们的过去，并为我们带来找回生育能力的机会。"
 io_clones.11.name:0 "[Root.Owner.GetSpeciesName]所见的[From.GetName]原风景"
 io_clones.11.desc:0 "对城市废墟中发现的长得像[Root.Owner.GetSpeciesName]的基因测序确定了这些残骸的主人与我们在基因序列上的显著相似性，可以得出结论，这些遗留物属于我们的祖先，并且远早于我们开始被克隆的年代。对建筑废墟的分析也确定了这些建筑是为适应我们的身体结构建造的。这基本验证了这颗星球是我们的发源地的假说。\n\n由此，[original_emperor.GetName]曾宣扬的我们是被提升的野兽的理论已经不攻自破。然而，城市中找不到可供解读的历史档案，遗骸中的DNA也因辐射残缺不全。若要找回我们的生育能力，必须要对[From.GetName]展开全面的调查。"
 io_clones.11.desc.imp_destoryed:0 "对城市废墟中发现的长得像[Root.Owner.GetSpeciesName]的基因测序确定了这些残骸的主人与我们在基因序列上的显著相似性，可以得出结论，这些遗留物属于我们的祖先，并且远早于我们开始被克隆的年代。对建筑废墟的分析也确定了这些建筑是为适应我们的身体结构建造的。这基本验证了这颗星球是我们的发源地的假说。\n\n由此，旧帝国曾宣扬的我们是被提升的野兽的理论已经不攻自破。然而，城市中找不到可供解读的历史档案，遗骸中的DNA也因辐射残缺不全。若要找回我们的生育能力，必须要对[From.GetName]展开全面的调查。"
 io_clones.12.name:0 "神圣庄严的古战场"
 io_clones.12.desc:0 "经过对[From.GetName]表面的搜索，我们的科学家发现了一处交战的痕迹，双方的骨骸接近[Root.Owner.GetSpeciesName]和[original_emperor.GetSpeciesName]。显然这是[original_emperor.GetName]曾经入侵这颗星球的证据。在一名[original_emperor.GetAdj]军官的尸体附近，我们找到了他的个人日记，其中写道：“这些土著的作战技巧和抵抗意志令人惊讶，我确信在帝国征服这里后他们会成为很好的兵源。”我们已经找出我们被作为帝国的士兵的原因了，然而关于我们历史的更多疑问仍然挥之不去。这里为什么会化为一片荒芜？帝国为什么又非要选择克隆技术？\n\n在凭吊了英勇的旧日[Root.Owner.GetSpeciesName]战士后，我们的科学家又开始了工作。"
 io_clones.12.desc.imp_destoryed:0 "经过对[From.GetName]表面的搜索，我们的科学家发现了一处交战的痕迹，双方的骨骸接近[Root.Owner.GetSpeciesName]和旧帝国士兵。显然这是旧帝国曾经入侵这颗星球的证据。在一名旧帝国军官的尸体附近，我们找到了他的个人日记，其中写道：“这些土著的作战技巧和抵抗意志令人惊讶，我确信在帝国征服这里后他们会成为很好的兵源。”我们已经找出我们被被作为帝国的士兵的原因了，然而关于我们历史的更多疑问仍然挥之不去。这里为什么会化为一片荒芜？帝国为什么又非要选择克隆技术？\n\n在凭吊了英勇的旧日[Root.Owner.GetSpeciesName]战士后，我们的科学家又开始了工作。"
 io_clones.13.name:0 "命运的阴暗面"
 io_clones.13.desc:0 "全面检索了[From.GetName]的表面之后，我们确信了由于我们先祖的英勇作战，[original_emperor.GetName]从来没有成功在这个星球的表面建立一个定居点。因此放弃了地面进攻，转而用舰队火力夷平了[From.GetName]的地表，摧毁了我们先祖的文明以绝后患。任何一个城市废墟内部都没能找到不被辐射严重破坏DNA的尸体，[original_emperor.GetName]一定是利用了先前抓获的俘虏制造了我们的克隆族群。在[From.GetName]找到我们先祖完整基因的序列以恢复生育能力的希望看起来已经相当渺茫了。\n\n然而，在[From.GetName]的一座中心城市的废墟中我们发现了一些加密资料，对这些资料的破译也许能让我们找到进一步的线索。"
 io_clones.13.desc.imp_destoryed:0 "全面检索了[From.GetName]的表面之后，我们确信了由于我们先祖的英勇作战，旧帝国从来没有成功在这个星球的表面建立一个定居点。因此放弃了地面进攻，转而用舰队火力夷平了[From.GetName]的地表，摧毁了我们先祖的文明以绝后患。任何一个城市废墟内部都没能找到不被辐射严重破坏DNA的尸体，旧帝国一定是利用了先前抓获的俘虏制造了我们的克隆族群。在[From.GetName]找到我们先祖完整基因的序列以恢复生育能力的希望看起来已经相当渺茫了。\n\n然而，在[From.GetName]的一座中心城市的废墟中我们发现了一些加密资料，对这些资料的破译也许能让我们找到进一步的线索。"
 io_clones.14.name:0 "燕石博物志"
 io_clones.14.desc:0 "通过对那些加密数据的分析，我们定位了一处位于地下数千米的人工洞穴，那里记录了我们文明过去的一切，遗留的全部知识、文化，以刻入岩壁的方式尽可能长久的保存。这就是我们先祖为了保全我们文明做的最大限度的努力，尽管看上去非常原始朴素，但我们的科学家看到后无不热泪盈眶。在洞穴的最深处，我们找到了一具石棺，里面是一具[Root.Owner.GetSpeciesName]遗骸，拥有我们恢复生育能力需要的全部基因序列。现在，我们已经确信我们来自[From.GetName]。\n\n摆脱克隆技术的桎梏的机会就在眼前，但这也意味着放弃来自其中的力量。一直以来我们尽管厌恶绝育的束缚，但从基因技术和大规模复制的结合中我们的获益远胜于不育的损失。我们要找回我们的生育能力吗？"
 io_clones.14.desc.a:0 "是时候找回正常生命的生活方式了。"
 io_clones.14.a.tooltip:0 "我们种族的生育能力将会恢复，代价是大大弱化克隆人士兵特质。军用克隆复合体将会和正常的克隆缸一样提供少量人口组装速度。"
 simple_fertility_restoration:0 "简单复育"
 io_clones.14.desc.b:0 "为什么要放弃我们好不容易得来的力量？"
 io_clones.14.b.tooltip:0 "我们会保持现状，尽管人民会对此不满。"
 give_up_fertility:0 "放弃复育机会"
 io_clones.14.desc.c:0 "我全都要。"
 io_clones.14.c.tooltip:0 "启动一个需要大量社会学研究投入的计划，以在恢复生育能力的同时最大限度地保存克隆人士兵的优势。"
 CLONE_SOLDIER_GUARD_FERTILITY_PERFECT:0 "完美复育"
 CLONE_SOLDIER_GUARD_FERTILITY_PERFECT_DESC:0 "必须尽一切努力稳定我们的强化基因，来确保其携带的特质能够遗传给下一代。"
 trait_clone_soldier_fertile_perfect:0 "完美克隆人士兵"
 trait_clone_soldier_fertile_perfect_desc:0 "§L在基因工程巅峰的克隆人，更加强健、高效、耐久和长寿——而且这些特性全部可以通过生殖遗传给下一代。§!"
 leader_trait_clone_army_perfect_commander:0 "完美克隆部队司令"
 leader_trait_clone_army_perfect_commander_desc:0 "从出生之日起便受到常人无法忍受的高强度纯军事化管理，该领袖展现出无与伦比的军事和领导才能。他的后代亦将如此。"
 io_clones.15.name:0 "重建家园"
 io_clones.15.desc:0 "既然我们已经确定了[real_origin.GetName]就是我们的母星，那么对她环境的恢复也顺理成章地提上了日程，社会各界正积极组织募捐来为改造项目提供经费，我们的环境工程科学家们也在以空前的热情工作。大家都盼望着回到我们最初的起源。"
 io_clones.15.a:0 "游子终究会回到故乡。"
 io_clones.16.name:0 "故乡，新家？"
 io_clones.16.desc:0 "[Root.GetName]的环境改造工作已经完成，旧日的废墟在改造过程中被小心的保留作为永久的纪念。而保存我们文明过去的洞窟成为了整个[From.GetName]最富盛名的旅游景点。我们的人民亲切而好奇地注视着祖先留下的痕迹。移民潮正在向[Root.GetName]涌去，有人提出应当把[Root.GetName]作为我们的新首都。"
 io_clones.16.desc.spiritualist:0 "[Root.GetName]的环境改造工作已经完成，旧日的废墟在改造过程中被小心的保留作为永久的纪念。而保存我们文明过去的洞窟成为了整个[From.GetName]的圣地。我们的人民亲切而好奇地注视着祖先留下的痕迹。移民潮正在向[Root.GetName]涌去，有人提出应当把[Root.GetName]作为我们的新首都。"
 io_clones.16.a:0 "是时候回家了。"
 io_clones.16.a.tooltip:0 "帝国内所有失业人口将会迁移至新首都。"
 io_clones.16.b:0 "不应该放弃[From.GetCapitalName]的首都地位。"
 terraforming_enthusiasm:0 "环境改造热情"
 build_new_capital:0 "建设新首都"
 build_new_capital_desc:0 "本地的建造工人充满热情。"
 immigration_wave:0 "移民潮"
 immigration_wave_desc:0 "移民正在大规模涌入这颗星球。"
 d_origin_cave:0 "石刻洞窟"
 d_origin_cave_desc:0 "整个人工洞穴系统的石壁上刻满了古代文字，记录了一个文明过去的一切。"
 militarized_society:0 "军事化社会"
 militarized_society_desc:0 "在接收这片封地并建立一个国家之前，我们首先是一支军队。上下一致的严明纪律和献身精神是我们社会的基石，尽管这片土地上并非都能人人都能接受这样的传统。\n\n§Y拥有§H克隆人士兵§!特质的人口占比越大，这个修正的效果就越强。§!"
 job_militia:0 "民兵"
 job_militia_plural:0 "民兵"
 job_militia_desc:0 "这些克隆人士兵从事简单的生产工作并在闲暇时接受军事训练。"
 mod_job_militia_add:0 "$job_militia$岗位"
 mod_job_militia_per_pop:0 "每$VALUE$个人口提供§G+1§!个$job_militia$岗位"
 mod_job_militia_per_pop_short:0 "\n每$VALUE$ £pop£ §G+1§! £mod_job_militia_add£ "
 job_elite_soldier:0 "克隆人精英"
 job_elite_soldier_plural:0 "克隆人精英"
 job_elite_soldier_desc:0 "通过克隆缸内有意的诱导，这些战士变得更强壮、聪明，他们往往是军队中的军官、工程师或特种部队。"
 mod_job_elite_soldier_add:0 "$job_elite_soldier$岗位"
 mod_job_elite_soldier_per_pop:0 "每$VALUE$个人口提供§G+1§!个$job_elite_soldier$岗位"
 mod_job_elite_soldier_per_pop_short:0 "\n每$VALUE$ £pop£ §G+1§! £mod_job_elite_soldier_add£"
 io_clones.100.name:0 "意外收获"
 io_clones.100.desc:0 "我们在帝国建立间谍网的重要目的之一就是寻找我们真正的起源，但关于我们种族过去的相关信息似乎被帝国删的丝毫不剩，因此这一任务也没有任何进展……直到今天。\n我们的间谍无意间在帝国的科技数据库中发现了对[our_real_home.GetName]的观测记录，其中提到了对当地捕获的生物样本进行的克隆实验。然而[our_real_home.GetName]如今表面正被剧毒大气笼罩，没有任何生命存在的可能性。试图追查[our_real_home.GetName]为何会变成这样的行动遭到了前所未有的阻力。帝国的特工可能意识到了我们发现了这条线索，因此我们只好中止行动。要最终解开这个谜题，可能唯一的办法就是把[our_real_home.GetName]纳入我们的版图，当然，这意味着对帝国的反叛。"
 io_clones.100.2.desc:0 "我们在帝国建立间谍网的重要目的之一就是寻找我们真正的起源，但关于我们种族过去的相关信息似乎被帝国删的丝毫不剩，因此这一任务也没有任何进展……直到今天。\n我们的间谍无意间在帝国的科技数据库中发现了对[our_real_home.GetName]的观测记录，其中提到了对当地捕获的生物样本进行的克隆实验。然而[our_real_home.GetName]如今表面正被剧毒大气笼罩，没有任何生命存在的可能性。试图追查[our_real_home.GetName]为何会变成这样的行动遭到了前所未有的阻力。帝安局可能意识到了我们发现了这条线索，因此我们只好中止行动。要最终解开这个谜题，可能唯一的办法就是把[our_real_home.GetName]纳入我们的版图，当然，这意味着对帝国的反叛。"
 our_real_home_title:0 "疑似发源地"
 our_real_home_desc:0 "从帝国观测数据库中无意发现的信息暗示了我们可能的发源地的所在。"
 our_real_home_location:0 "疑似发源地坐标"
 our_real_home_location_desc:0 "从帝国观测数据库中无意发现的信息暗示了这一星球可能是我们的发源地。"

 origin_old_alliance:0 "§Y古老同盟§!"
 opinion_old_alliance:0 "古老同盟"
 origin_old_alliance_desc:0 "作为银河统一前许久便与皇帝合作的重要盟友，这一国家在星海帝国建立后被授予了帝国议会的永久席位。"
 origin_old_alliance_effects:0 "—在开始时拥有帝国议会的常任席位。和皇帝之间获得§G100§!关系奖励。\n—如果没有§H星海霸业§!起源的国家，这个起源会被替换为§H繁荣一统§!。"

 origin_monopoly_chaebol:0 "§Y垄断财阀§!"
 origin_monopoly_chaebol_desc:0 "这一巨型企业抓住时机，投资了最伟大的项目——银河的统一，并得到了自己的回报。如今，全银河的市场正对他们敞开。"
 origin_monopoly_chaebol_effects:0 "—在开局便拥有§H帝国贸易特许§!。\n—通过拓展帝国内的贸易分部并控制更多的贸易额，可以获得强有力的§H贸易垄断§!修正。\n—只要保持§H帝国贸易特许§!，便可以无视无法附庸帝国成员的限制，在帝国内部通过战争建立§H子公司§!，子公司的所有星球在结算§H贸易垄断§!时视为拥有你的分部。\n—如果没有§H星海霸业§!起源的国家，这个起源会被替换为§H繁荣一统§!。"
 trade_monopoly:0 "贸易垄断"
 trade_monopoly_desc:0 "真正的统治者不在皇座上而在办公桌前，掌控整个银河的经济就等于掌控整个银河。\n\n§Y拥有我们§H企业分部§!的星球产出的贸易额占全帝国贸易额的比例越高，这个修正的效果就越强。§!"
 war_goal_wg_megacorp_subjugate_monopoly_chaebol:0 "纳为子公司"
 war_goal_wg_megacorp_subjugate_monopoly_chaebol_desc:0 "以帝皇之名，我们会为他们带来星海帝国的自由贸易。\n\n若是通过“维持现状”结束战争的话，我们所占据的恒星系将会被释放为新的子公司，前提是该子公司被释放后必须拥有至少一个行星。"
 casus_belli_cb_io_monopoly_chaebol:0 "垄断财阀"
 cannot_without_charter:0 "$TRIGGER_FAIL$我们需要帝皇的贸易特许来保障这场战争的合法性。"
 START_SCREEN_MONOPOLY_CHAEBOL:0 "在与星海帝国一并崛起之前，我们不过是一个靠着[GetHomeWorldName]周边的零星贸易赚取微薄收入的小企业。然而，一个天赐的机遇降临到了我们面前。一个颇具潜力的帝国——自认为有统御星海的能力，选择了与我们合作来换取一场伟大远征所需的一切。财富、资源，甚至是舰船，我们有求必应。于是我们的商船得以紧随他们战舰的脚步，收割他们征服之处的利润，并反过来喂饱他们的战争机器。终于，在他们的帝国构建完成之后，我们也得到了构建我们的商业帝国所需的一切。\n\n也许有人会觉得我们不过走狗，可以被皇帝予取予求的提款机，觉得我们的一切辉煌仅仅被一张薄纸支撑。他们错了。有人把皇帝比作帝国的大脑，那么我们便是心脏，整个帝国的经济血脉依仗我们流淌，而孰轻孰重，尚未可知。"

 origin_outside_the_border:0 "§E化外之民§!"
 origin_outside_the_border_desc:0 "这一政权认为超国家组织是对自己独立主权的侵犯，坚决抵制与这类组织的合作。"
 origin_outside_the_border_effects:0 "—如果有国家使用了监管人或者帝皇起源，这一国家开始不会加入共同体/帝国。\n—自动获得同名国策及其加成。\n—如果没有§H星海霸业§!或§H星海监管§!起源的国家，这个起源会被替换为§H繁荣一统§!。"
 origin_internal_border:0 "§E骨肉分离§!"
 origin_internal_border_desc:0 "这一政权在星际组织权力扩张与银河自决的冲突中被撕裂成两个互不承认的政权。一半的领土被帝国/共同体的忠诚成员占据，而另一半则保持独立。"
 origin_internal_border_effects:0 "—将会生成一个物种相同的邻国，拥有和皇帝/监管人相同的政府和思潮并加入星海帝国/共同体。\n—两个国家互相获得对方全境的宣称。\n—如果没有§H星海霸业§!或§H星海监管§!起源的国家，这个起源会被替换为§H繁荣一统§!。\n\n§R警告：此起源国家与皇帝必须都是普通/蜂巢/机械类型，否则会导致闪退！§!"
 origin_galactic_nemesis:0 "§M星海天罚§!"
 origin_galactic_nemesis_desc:0 "这一文明获得了某种不可知的力量支持他们的大业，试图以埋葬整个银河为代价促成他们的飞升。"
 origin_galactic_nemesis_effects:0 "—在一开始就解锁§M化身天灾§!的相关机制，并立刻完成完整的§H至高§!传统树。\n—最高的§M威慑力等级§!将会被立刻解锁，并§R引发与整个银河的战争§!。\n—如果没有§H星海霸业§!或§H星海监管§!起源的国家，这个起源会被替换为§H繁荣一统§!。\n—由于游戏代码的限制，请在一个月内自行选择§M化身天灾§!飞升天赋以确保不会产生BUG。否则国家将会§R被来自虚境的神秘力量摧毁。§!"
 io_imperial_border.4.name:0 "§M星海天罚§!"
 io_imperial_border.4.desc:0 "往日困扰我们的一切疑惑已然得到解答，往日环绕我们的一切痛苦即将得到解脱。星光将会在整个银河熄灭，而我们将会是唯一的光。如今挡在我们面前的障碍只有一个——[global_event_country.GetGalCommunityOrGalImperium]。这一非法组织的腐败政客正在讲坛上声嘶力竭，妄图动员他们的乌合之众来破坏我们的伟业。银河正呼唤一场全面战争，一场比一切智慧生命所能想象的更全面更彻底的战争，而我们必将取胜。"
 io_imperial_border.4.a:0 "来吧。"
 tr_supremacy_complete:0 "§H至高§!传统树已完成。§M化身天灾§!飞升天赋已经可选。"
 please_choose_ascension_perk:0 "由于游戏代码的限制，请在一个月内自行选择§M化身天灾§!飞升天赋以确保不会产生BUG。否则国家将会§R被来自虚境的神秘力量摧毁。"
 explore_modifier:0 "深空探索"
 explore_modifier_desc:0 "银河的大部分已经被瓜分完毕，对于剩下的部分，我们应加倍仔细的探索。"

 origin_secondary_hemegon_vassal:0 "§Y星海封臣§!"
 origin_secondary_hemegon_vassal_desc:0 "这一文明在进入太空后不久即被另一星海霸权征服并沦为附庸。"
 origin_secondary_hegemon:0 "§Y星海割据§!"
 origin_secondary_hegemon_desc:0 "这一文明打造了自己的霸权与星海帝国对立。尽管其势力范围较小，但在其辖制的一方水土有着极强的掌控力。"
 origin_tooltip_secondary_hegemon_effects:0 "—在开局拥有更大的版图，更多的舰队和三个物种、思潮全部随机的不同类型的专精§H附庸国§!。\n-你的§Y附属§!不会因为你拥有过多附属而负担$r_loyalty$惩罚。\n—可以对帝国成员使用§H强制附庸§!战争借口。\n—如果没有§H星海霸业§!起源的国家，这个起源会被替换为§H繁荣一统§!。"
 war_goal_wg_conquer_imperial_member:0 "附庸帝国成员"
 war_goal_wg_conquer_imperial_member_desc:0 "这场战争是为了强迫帝国的成员离开帝国并成为我们的附庸。\n\n若是通过“维持现状”结束战争的话，我们所占据的恒星系将会被释放为新的附庸，前提是他们被释放后必须拥有至少一个行星。"
 casus_belli_cb_io_invade:0 "征服帝国"
 origin_prospecting_machine:0 "§Y开发机械§!"
 origin_prospecting_machine_desc:0 "这一机械智能网络被帝国部署至银河统一战争留下的废土，以在这些被破坏到有机生物几乎无法居住的地区开采资源并进行工业生产。"
 origin_prospecting_machine_effects:0 "—作为帝国的§H开发邦§!附庸开始游戏。\n—可以无限制建造§H采矿区划§!，采矿区划提供+2住房，每三个采矿区划+1建筑槽位。\n—可以将荒芜星球改造为§H机械世界§!且无需机械世界飞升。\n—如果没有§H星海霸业§!起源的国家，这个起源会被替换为§H繁荣一统§!。"
 START_PROSPECTING_MACHINE:0 "正在加载日志……\n\n“是的，这该死的鬼地方完全没法住人了”"
 SUBJECT_academy_territory:0 "科研领"
 SUBJECT_DESC_academy_territory:0 "皇帝划定的自由科研地区，不受帝国政府的直接干涉，仅负责向中央提供科研成果。"
 SUBJECT_industrial_network:0 "工业网络"
 SUBJECT_DESC_industrial_network:0 "由帝国部署负责资源开发和精炼的人工智能网络，需要上交开采的资源且没有外交权力。"

 origin_prime_minister_in_silver:0 "§Y银衣宰相§!"
 origin_prime_minister_in_silver_desc:0 "这一机械智能网络被帝国最天才的头脑设计用以协助整个银河的治理。其拥有高度自主权和独立控制的武装，以及绝对忠于帝国的程序。"
 origin_prime_minister_in_silver_effects:0 "—作为帝国的“管理中枢”附庸开局，免除税收且外交自主，必须与帝国协同作战，不能以全面战争以外的任何形式扩张，在战争中击败的国家会自动成为帝国的附庸。在开始时拥有帝国议会的常任席位。\n—和帝国之间获得极大的关系奖励，禁止背叛帝国的行为。\n—起始星系是一个部分开发的环世界，初始版图较小且境内不会拥有宜居星球。\n—可以建造§H帝国行政矩阵§!建筑，生产凝聚力并为星海帝国的统治者提供法令经费，帝国会根据该国的贡献提供补贴，可以通过政策切换补贴种类。\n—如果没有§H星海霸业§!起源的国家，这个起源会被替换为§H繁荣一统§!。"
 job_aide_drone:0 "辅政子个体"
 job_aide_drone_plural:0 "辅政子个体"
 job_aide_drone_desc:0 "这些子个体宛如神经元一般互相连接，构成的巨型神经网络日夜不停处理帝国的政务。"
 mod_job_aide_drone_add:0 "$job_aide_drone$岗位"
 building_imperial_administrative_matrix:0 "帝国管理矩阵"
 building_imperial_administrative_matrix_desc:0 "来自银河各处的数据流被这一宏大的设施接收，在其内部无数互相连接的子个体对其进行汇总及分析处理，得出的结论会被帝国的行政体系作为最具参考价值的建议。在某些地方，管理矩阵甚至部分替代了官员的职能。"
 mod_country_ai_uprising_administration_produces_add:0 "星海帝皇的法令经费"

 ap_master_of_own_life:0 "我命由我"
 ap_master_of_own_life_desc:0 "的确，我们在不知情的情况下就被剥夺了生育的能力，改造为了批量复制的战争机器。然而，错误的不是改造，而是我们没有选择自己如何被改造的权力。如今我们社会的成就证明了我们不仅适应了后生化改造时代的生活，而且比任何所谓的“自然生命”都更为优越。那么是时候了，就从今天开始，我们将亲自定义自己的生命。既然躯壳不过转瞬即逝，那就让它辉煌灿烂地燃烧吧！"
 overtuned_traits_allowed:0 "可以为我们的克隆士兵人口选择默认物种特质的§Y强夺天工§!版本。同时这些特质还可以被§Y不问后果§!法令进一步增强。\n- §Y强夺天工§!特质可以由基因编辑随意添加和移除。"
 requires_clone_gene_unlocked:0 "$TRIGGER_FAIL$需要已经复育或者解锁克隆士兵的潜能。"
 NAME_clone_guard_home:0 "火焚末日"
 NAME_clone_guard_system:0 "帝皇之怒"
 NAME_clone_guard_home_retured:0 "新生"
 NAME_clone_guard_system_retured:0 "曙光"

 io_chosen.1.name:0 "§M虚境谕使§!"
 io_chosen.1.desc:0 "当其他人研究我们过去的历史，会发现其中充满了谜团——即使考虑到我们种族的灵能能力，我们的进步比起其他文明还是过于迅速了，更不要说几个关键点的科技进步和社会变革仿佛发生的毫无征兆。当然，我们自己知道其中真相，早在中古时代，我们便将我们的命运尽数交付给了我们的超主，而祂则做出了一个承诺：我们将会获得直达星宇的力量，因那漆黑无垠的虚空深处有着我们之外的万千生灵，我们会把他们的命运之恩赐尽数夺取，再向主双手奉上，如此，无尽的胜利与荣耀将属于我们。"
 origin_chosen_of_the_shroud:0 "§M虚境谕使§!"
 origin_chosen_of_the_shroud_desc:0 "这一文明在进入太空之前便早已被来自虚境的远古存在选中，作为在这片银河散布其腐蚀的先导者。"
 origin_chosen_of_the_shroud_effects:0 "—开局的时候便已完成整条§M灵能§!传统树，并与一位可选的虚境大能达成最高等级的契约。\n—开局时拥有四位强大的§M神选者§!领袖。\n—降低与大多数帝国的关系，对其他帝国拥有兼具§Y输出意识形态§!和§Y强制附庸§!效果的§H黑暗远征§!宣战理由，对星海帝皇有§H伪帝去死§!的§Y全面战争§!宣战理由。\n—每次赢得舰队战都有概率获得来自虚境的§G赐福§!，相对的，每次失败都有概率带来§R诅咒§!。\n—可以在附庸国建立§Y附属圣所§!地产，提供全帝国的修正并使这个附庸成为你超主的契约者。\n—如果没有§H星海霸业§!或§H星海监管§!起源的国家，这个起源会被替换为§H繁荣一统§!。"
 io_chosen.1.a:0 "以§G生命之织缕§!之名！"
 io_chaos_warriors_comes_composer:0 "我们现在拥有§M$civic_psionic_sovereign$§!国策。\n我们以后可以通过§H接触§!菜单和虚境交流。\n我们的领袖成为了一名强大的§G$composer_chosen$§!，此外还有三位§G$composer_chosen$§!会出现在我们的国家。"
 io_chosen.1.b:0 "以§R世界之喰煞§!之名！"
 io_chaos_warriors_comes_eater:0 "我们现在拥有§M$civic_psionic_sovereign$§!国策。\n我们以后可以通过§H接触§!菜单和虚境交流。\n我们的领袖成为了一名强大的§R$eater_chosen$§!，此外还有三位§R$eater_chosen$§!会出现在我们的国家。"
 io_chosen.1.c:0 "以§H渴求之器具§!之名！"
 io_chaos_warriors_comes_instrument:0 "我们现在拥有§M$civic_psionic_sovereign$§!国策。\n我们以后可以通过§H接触§!菜单和虚境交流。\n我们的领袖成为了一名强大的§H$instrument_chosen$§!，此外还有三位§H$instrument_chosen$§!会出现在我们的国家。"
 io_chosen.1.d:0 "以§B虚空之低语§!之名！"
 io_chaos_warriors_comes_whisperers:0 "我们现在拥有§M$civic_psionic_sovereign$§!国策。\n我们以后可以通过§H接触§!菜单和虚境交流。\n我们的领袖成为了一名强大的§B$whisperers_chosen$§!，此外还有三位§B$whisperers_chosen$§!会出现在我们的国家。"

 boon.io_chosen:0 "看起来虚境中的强大存在对我们最近的胜利非常满意，并乐意给我们一点小小的支持。"
 
 io_chosen.3029.desc:0 "[won_leader.GetName]在[won_locationr.GetName]的战斗中的精彩表现得到了我们超主的赏识，现在我们的超主已经对他降下了赐福。"
 io_chosen.3030.desc:0 "$boon.io_chosen$$boon.psi.link$\n\n一种对平静的深远认识迅速传遍了[Root.GetName]，看起来那些没有灵能能力的人甚至也被影响了。"
 io_chosen.3031.desc:0 "$boon.io_chosen$$boon.ship.link$\n\n我们的舰队里以往舰船受到的磨损几乎消失了，因此我们的维护费用有了大幅的降低。"
 io_chosen.3032.desc:0 "$boon.io_chosen$$boon.psi.link$\n\n我们的科学家建立了一个暨由心灵感应分享的知识集库，这将极大地提高他们的工作效率。"
 io_chosen.3033.desc:0 "$boon.io_chosen$$boon.ship.link$\n\n我们的战舰乘员现在能用灵能来强化护盾系统了。"
 io_chosen.3034.desc:0 "$boon.io_chosen$$boon.ship.link$\n\n通过使用灵能，我们的战舰乘员现在能强化武器系统。"
 io_chosen.3035.desc:0 "$boon.io_chosen$$boon.ship.link$\n\n通过使用灵能，我们的战舰乘员现在能加快武器的开火速率。"
 io_chosen.3036.desc:0 "$boon.io_chosen$$boon.psi.link$\n\n一种对团结的认知开始出现在我们居民的心智中，他们现在看起来更愿意通力合作，向着政府设立的目标前进。"
 io_chosen.3037.desc:0 "$boon.io_chosen$$boon.psi.link$\n\n我们的同理心比以往更强烈了，导致我们拥有更大的政治影响力。"
 io_chosen.3038.desc:0 "$boon.io_chosen$$boon.psi.link$\n\n我们感到了前所未有的团结。"
 io_chosen.3039.desc:0 "$boon.io_chosen$$boon.ship.link$\n\n通过使用灵能，我们的战舰乘员现在能直接影响舰船的移动，使船面对敌方火力时闪避率更高。"
 io_chosen.3040.desc:0 "$boon.io_chosen$$boon.ship.link$\n\n通过使用灵能，我们的战舰乘员现在能行使有限的战地维修，用他们的心智修补船体裂隙。"
 io_chosen.3041.desc:0 "$boon.io_chosen$$boon.psi.link$\n\n我们的通灵者已用他们的力量暂时减缓了我们最杰出领袖们的衰老进程，使他们的自然寿命增加了数十年。可惜的是我们没有足够多的能量将这种效果赐予大量人口。"
 io_chosen.3041.tooltip:0 "所有领袖获得§Y延长寿命§!特质，获得§G+40§!年领袖寿命。"
 io_chosen.3042.desc:0 "$boon.io_chosen$$boon.ship.link$\n\n通过使用灵能，我们的战舰乘员现在能强化舰船推进器的强度，使舰船亚光速速度明显提高。"
 io_chosen.3043.desc:0 "$boon.io_chosen$$boon.psi.link$\n\n这股力量强化了我们士兵的心智，他们现在愿意勇闯战场上的任何危险。他们的团队精神无人能出其右。"
 io_chosen.3044.desc:0 "$boon.io_chosen$$boon.psi.link$\n\n我们现在能感知到比传统传感阵列探测距离更远处的舰船移动了。"

 boon.io_chosen_neg:0 "看起来虚境中的强大存在对我们最近的失败非常不满，并诅咒了我们。"

 io_chosen.3050.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\n这似乎对我们居民的幸福度产生了深远影响，如今一股对忧郁的认知席卷了[Root.GetName]。甚至连离群者都能感受到。"
 io_chosen.3051.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\n这种负面能量席卷了我们公民的内心。很多人开始向往和我们政府不合的激进理念。这种影响甚至感染了无灵能居民！"
 io_chosen.3052.desc:0 "$boon.io_chosen_neg$$curse.ship.link$\n\n它们的装甲变得易碎起来，只能承受比以往更少的伤害。"
 io_chosen.3053.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\n因为某种原因，这对全[Root.GetName]的生育率产生了损害。这甚至对没有天生灵能能力的物种产生了影响！"
 io_chosen.3054.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\n我们研究者的内心变得阴暗无比，这对他们专注工作有很大影响。"
 io_chosen.3055.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\n我们积聚政治影响力的速率被明显降低了。"
 io_chosen.3056.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\n曾经存在于我们公民心中对团结的认知涣散了。"
 io_chosen.3057.desc:0 "$boon.io_chosen_neg$$curse.ship.link$\n\n我们的舰船移动时，似乎有某种不可见的力量在阻止他们，就像橡皮圈一样。这对我们亚光速航行有很大影响。"
 io_chosen.3058.desc:0 "$boon.io_chosen_neg$$curse.psi.link$\n\n这种负面能量侵蚀了我们地面部队的士气，这期间他们在战场上的效率会更低。"
 io_chosen.3059.desc:0 "$boon.io_chosen_neg$一股强大的灵能反噬沿着我们与虚境建立的传导通路袭来，而且这似乎干扰了我们的星际传感器。\n\n从所有来源收到的传感器分辨率都大幅降低了，导致探测距离变短。"

 job_overlord_telepath:0 "宗主灵能使"
 job_overlord_telepath_plural:0 "宗主灵能使"
 job_overlord_telepath_desc:0 "为该国的虚境崇拜者宗主服务的灵能者部队，监督着这一附庸以确保其为他们的神奉献一切。"
 job_overlord_telepath_effect_desc:1 "£job_overlord_telepath£ $job_overlord_telepath_plural$生产 £unity£ §Y$unity$§!，并减少£crime£ §Y$PLANET_CRIME_TITLE$§!，根据宗主签订的契约的不同为行星提供减益并为宗主产出资源。"
 mod_job_overlord_telepath_add:0 "$job_overlord_telepath$岗位"
 mod_job_overlord_telepath_per_pop:0 "每$VALUE$个人口提供§G+1§!个$job_overlord_telepath$岗位"
 mod_job_overlord_telepath_per_pop_short:0 "\n每$VALUE$ £pop£ §G+1§! £mod_job_overlord_telepath_add£ "

 io_chosen.11.name:0 "契约"
 io_chosen.11.desc:0 "在我们首都的圣所落成之后，我们的宗主强迫我们在其中与他们的虚境神明签订了契约。"

 building_composer_sanctum_holding:0 "织缕分支圣所"
 building_composer_sanctum_holding_desc:0 "宗主大发慈悲地建造了这个圣所，确保他们的附庸也有一处与生命之织缕沟通的地方。"
 building_eater_sanctum_holding:0 "喰煞分支圣所"
 building_eater_sanctum_holding_desc:0 "宗主大发慈悲地建造了这个圣所，确保他们的附庸也有一处与世界之喰煞沟通的地方。"
 building_instrument_sanctum_holding:0 "器具分支圣所"

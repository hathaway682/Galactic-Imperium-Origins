l_simp_chinese:
 ####################################
 # Hathaway682
 ####################################
 origin_sage_of_the_deep:0 "深空智主"
 origin_sage_of_the_deep_desc:0 "这群从策展人组织分裂的科学家以指引者的身份出现在了一个年轻文明面前，并将他们带入了太空时代。"
 origin_sage_of_the_deep_effects:0 "—起始恒星系除母星外拥有三个科研居住站。\n—主体种族拥有§H策展人分离者§!特质，提供强大的加成并为科学家提供策展人特质，同时宜居环境改为§H轨道居住站§!。\n—在母星获得拥有§H蒙恩者§!特质的第二种族。\n—可以进行一些一般国家无法研究的特殊项目。"
 origin_esoteric_scholarium:0 "§Y秘传学士§!"
 origin_esoteric_scholarium_desc:0 "从策展人组织分裂，这一文明通过为帝国提供科学技术换取了一片能够不受限制自由进行科学研究的星域和帝国的军事保护。"
 origin_esoteric_scholarium_effects:0 "—作为帝国的§H科研邦§!特殊附庸开局。\n—主体种族拥有§H策展人分离者§!特质，提供强大的加成并为科学家提供策展人特质，同时宜居环境改为§H轨道居住站§!。\n—国境内将会拥有一些正常星球宜居的人口随封邑转增。\n—可以建造§H专精科研§!建筑，可以通过§M稀有文物§!解锁§H事件科技§!的研究选项。\n—如果没有§H银河霸业§!起源的国家，这个起源会被替换为§H繁荣一统§!。"
 trait_curator_defector:0 "策展人分离者"
 trait_curator_defector_desc:0 "从策展人组织分裂出来，这一种族掌握了很多其他种族所不知的科技秘密。不过他们常常沉迷研究而忽视其他事务。"
 building_curator_archive:0 "策展人数据库"
 building_curator_archive_desc:0 "策展人的智慧无穷无尽，我们能带走的只有大海中的一滴。"
 esoteric_scholarium_system_NAME:0 "策展人空间站"
 esoteric_scholarium_system_DESC:0 "选择策展人起源时的起始恒星系，拥有一个科研居住站和一个宜居星球。"
 esoteric_scholarium_system_sol_NAME:0 "策展人空间站（太阳系）"
 esoteric_scholarium_system_sol_DESC:0 "策展人起源起始恒星系的太阳系版本。"
 job_physics_researcher:0 "物理研究人员"
 job_physics_researcher_plural:0 "物理研究人员"
 job_physics_researcher_desc:0 "专精于物理学研究的科学家。"
 mod_job_physics_researcher_add:0 "$job_physics_researcher$岗位"
 job_physics_researcher_effect_desc:1 "£job_physics_researcher£ $job_physics_researcher_plural$将 £consumer_goods£ §Y$consumer_goods$§!转化为 £physics£ §Y物理学研究点数§!"
 job_engineering_researcher:0 "工程研究人员"
 job_engineering_researcher_plural:0 "工程研究人员"
 job_engineering_researcher_desc:0 "专精于工程学研究的科学家。"
 mod_job_engineering_researcher_add:0 "$job_engineering_researcher$岗位"
 job_engineering_researcher_effect_desc:1 "£job_engineering_researcher£ $job_engineering_researcher_plural$将 £consumer_goods£ §Y$consumer_goods$§!转化为 £engineering£ §Y工程学研究点数§!"
 job_society_researcher:0 "社会研究人员"
 job_society_researcher_plural:0 "社会研究人员"
 job_society_researcher_desc:0 "专精于社会学研究的科学家。"
 mod_job_society_researcher_add:0 "$job_society_researcher$岗位"
 job_society_researcher_effect_desc:1 "£job_society_researcher£ $job_society_researcher_plural$将 £consumer_goods£ §Y$consumer_goods$§!转化为 £society£ §Y社会学研究点数§!"
 policy_scientific_taboo:0 "科学禁忌"
 policy_scientific_taboo_desc:1 "科学研究的界限在哪里是一个重要的课题。\n"
 moral_taboo:0 "道德禁忌"
 moral_taboo_name:0 "道德禁忌"
 moral_taboo_desc:0 "科学进步是服务于社会进步的，绝不能本末倒置。我们必须以伦理道德要求自己，防止研究的越界。\n\n"
 legal_taboo:0 "法律禁忌"
 legal_taboo_name:0 "法律禁忌"
 legal_taboo_desc:0 "一项研究在社会上很可能比在学术上先一步造成影响。为了最小化社会影响，我们的研究事业至少不能违反星际法。\n\n"
 rational_taboo:0 "理性禁忌"
 rational_taboo_name:0 "理性禁忌"
 rational_taboo_desc:0 "既然我们有理性武装自己，为什么我们要放任一帮被感性支配的乌合之众对我们的研究指手画脚？他们也许永远学不会理解，但他们可以学会服从。\n\n"
 no_taboo:0 "无禁忌"
 no_taboo_name:0 "无禁忌"
 no_taboo_desc:0 "§R没有比真理更让人渴求之物，也没有比真理更加残酷之物。§!\n\n"

 artifact_space_whale_weapon:0 "技术复原：能量虹吸"
 artifact_space_whale_weapon_desc:0 "我们急需一种能够对抗护盾的能量武器，对数据库中缇杨奇生态的研究可以帮到忙。"
 artifact_mining_drone_weapon:0 "技术复原：切割光束"
 artifact_mining_drone_weapon_desc:0 "通过模仿古代采矿无人机进行对激光功率的调整，我们可以大大增强其对装甲威力。"
 artifact_space_cloud_weapon:0 "技术复原：天云闪电"
 artifact_space_cloud_weapon_desc:0 "通过研究数据库中虚空之云的构造，我们可以设计一种特殊的气体，允许我们在太空中制造电弧。"
 artifact_null_void_beam:0 "技术复原：太虚光束"
 artifact_null_void_beam_desc:0 "对太虚的认知使得我们能够直接消灭能量，基于此我们可以设计一种强大的反护盾武器。"
 artifact_amoeba_strike_craft:0 "技术复原：变形虫鞭毛"
 artifact_amoeba_strike_craft_desc:0 "太空变形虫产生的鞭毛可以在太空环境下繁殖，我们可以将其改造为类似舰载机的武器。"
 artifact_extradimensional_weapon:0 "技术复原：物质分解"
 artifact_extradimensional_weapon_desc:0 "策展人的知识不止局限于三个维度，对高维空间的深度认知使得我们可以设计出一种直接摧毁粒子间键联系的武器。"
 artifact_swarm_weapon:0 "技术复原：生物武器"
 artifact_swarm_weapon_desc:0 "数据库中记录了一群星际间的流亡者，它们的DNA可以用以制造强力的生物武器，例如杀伤力极强的化学物质导弹或是可以作为舰载机使用的凶残虫类生命体。"
 artifact_regenerative_hull_tissue:0 "技术复原：舰体再生"
 artifact_regenerative_hull_tissue_desc:0 "通过培育一种特殊的硅基微生物，我们可以实现战舰装甲的自我修复。"
 artifact_nanite_repair_system:0 "技术复原：纳米修复"
 artifact_nanite_repair_system_desc:0 "经过数据库的查证与比对，我们发现我们收集到的纳米机器人最早的用途与太空结构工程相关，利用它我们可以高效的修复船体与装甲。"
 artifact_enigmatic:0 "技术复原：神秘编码"
 artifact_enigmatic_desc:0 "远古数据的加密方式在被逆向工程后可以成为一种新的军用密码，大大提高我们战舰的作战能力。"
 artifact_crystal_armor_1:0 "技术复原：水晶镀层"
 artifact_crystal_armor_1_desc:0 "对晶态生命的仿生学研究揭示了稀有水晶制成的镀层可以大大强化船体。"
 artifact_crystal_armor_2:0 "技术复原：水晶锻造镀层"
 artifact_crystal_armor_2_desc:0 "随着我们在材料学领域的进步，水晶镀层的加工技术也得以改良。"
 artifact_dragon_armor:0 "技术复原：龙鳞装甲"
 artifact_dragon_armor_desc:0 "策展人数据库记载了一种能够撑过大坍缩的太古生物——以太龙，对其体表鳞片的仿生学研究可以使我们设计出新一代的装甲。"
 artifact_dark_matter:0 "技术复原：暗物质"
 artifact_dark_matterr_desc:0 "那些堕落帝国以为他们的技术独一无二，但只要有足够的样本，我们就能按照数据库的资料复原他们的暗物质科技。"
 artifact_psionic_barrier:0 "技术复原：心灵力量"
 artifact_psionic_barrier_desc:0 "其他文明的科学家拒绝接受心灵力量的存在，只是因为他们缺乏证据，而我们恰好有很多第一手的证据。"
 artifact_secrets_boal:0 "技术复原：巴奥"
 artifact_secrets_boal_desc:0 "我们的数据库记载巴奥可以在类似果园的设施中通过种植作物获取消费品，通过足够的稀有文物，我们可以复原这项技术。"
 artifact_secrets_cybrex:0 "技术复原：赛博勒克斯"
 artifact_secrets_cybrex_desc:0 "我们的数据库记载赛博勒克斯使用一种极其高效的算法控制他们的采矿无人机，通过足够的稀有文物，我们可以复原这项技术。"
 artifact_secrets_irassian:0 "技术复原：伊拉斯"
 artifact_secrets_irassian_desc:0 "我们的数据库记载伊拉斯人拥有高效的舰船生产设施，通过足够的稀有文物，我们可以复原这项技术。"
 artifact_secrets_league:0 "技术复原：第一联盟"
 artifact_secrets_league_desc:0 "我们的数据库记载第一联盟在文档归类和储存方面尤为领先，通过足够的稀有文物，我们可以复原这项技术。"
 artifact_secrets_vultaum:0 "技术复原：沃陶姆"
 artifact_secrets_vultaum_desc:0 "我们的数据库记载沃陶姆人的计算机曾试图对“现实”的源代码进行逆向工程，通过足够的稀有文物，我们可以复原这项技术。"
 artifact_secrets_yuht:0 "技术复原：尤特"
 artifact_secrets_yuht_desc:0 "我们的数据库记载尤特曾利用其强大的探测阵列观测银河，通过足够的稀有文物，我们可以复原这项技术。"
 artifact_secrets_zroni:0 "技术复原：泽珞"
 artifact_secrets_zroni_desc:0 "我们的数据库记载泽珞族的遗骸可以用来生成环绕整个星系的灵能风暴，通过足够的稀有文物，我们可以复原这项技术。"

 mod_planet_researchers_minor_artifacts_produces_add:0"来自£job_researcher£ [GetResearcherPlural]的£minor_artifacts£ $minor_artifacts$"